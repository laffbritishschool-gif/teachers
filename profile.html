<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile | Laff British Montessori School</title>
<meta name="description" content="Teacher profile and account information for Laff British Montessori School.">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/portal-loader.css">
<style>
.profile-page{display:grid;gap:20px;max-width:1100px}
.profile-hero{position:relative;overflow:hidden;border-radius:26px;padding:26px;background:linear-gradient(135deg,#082b63,#0b5ed7);color:#fff;box-shadow:0 22px 50px rgba(8,43,99,.18)}
.profile-hero:after{content:'';position:absolute;width:260px;height:260px;right:-105px;top:-125px;border-radius:50%;border:40px solid rgba(244,194,13,.14)}
.profile-hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:18px}
.profile-avatar{width:92px;height:92px;flex:0 0 92px;border-radius:24px;background:#ffffff18;border:3px solid #ffffffcc;display:grid;place-items:center;overflow:hidden;font-size:28px;font-weight:900}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-kicker{font-size:10px;font-weight:900;letter-spacing:.08em;color:#f8d84b}
.profile-hero h2{margin:7px 0 5px;font-size:29px}
.profile-hero p{margin:0;color:#dbe8ff;font-size:12px}
.profile-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.profile-badge{padding:7px 10px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff22;font-size:10px}
.profile-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.profile-card{background:#fff;border:1px solid #e4eaf2;border-radius:20px;padding:20px;box-shadow:0 8px 25px rgba(20,45,80,.06)}
.profile-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:15px}
.profile-card-head h3{margin:0;font-size:18px;color:#13233f}
.profile-card-head p{margin:4px 0 0;color:#667085;font-size:11px}
.info-list{display:grid}
.info-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #edf1f6}
.info-row:last-child{border-bottom:0}
.info-row span{font-size:10px;color:#8792a3}
.info-row strong{font-size:11px;color:#13233f;text-align:right;word-break:break-word}
.assignment-list{display:grid;gap:9px}
.assignment{padding:12px;border:1px solid #e7edf5;border-radius:13px;background:#fbfdff}
.assignment strong{display:block;font-size:12px;color:#13233f}
.assignment span{display:block;margin-top:4px;color:#7d899b;font-size:10px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.profile-note{padding:12px 13px;border:1px dashed #dbe4ef;border-radius:13px;background:#f8fbff;color:#6e7b8f;font-size:10px;line-height:1.5;margin-top:15px}
.profile-empty{padding:30px;text-align:center;color:#667085}
.status-active{color:#16834b!important}
.status-inactive{color:#c62828!important}
@media(max-width:820px){.profile-grid{grid-template-columns:1fr}}
@media(max-width:620px){.profile-hero-inner{align-items:flex-start;flex-direction:column}.profile-avatar{width:80px;height:80px;flex-basis:80px}.profile-hero h2{font-size:24px}.profile-card{padding:16px}.info-row{align-items:flex-start;flex-direction:column;gap:4px}.info-row strong{text-align:left}}
</style>
</head>
<body data-title="My Profile">
<div id="page-loader" class="lbs-loader" aria-live="polite">
  <div class="lbs-loader-card">
    <img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School">
    <div class="lbs-loader-ring"></div>
    <div class="lbs-loader-title">Opening My Profile</div>
    <div class="lbs-loader-text">Loading your teacher information…</div>
    <div class="lbs-loader-bar"></div>
    <div class="lbs-loader-dots"><span></span><span></span><span></span></div>
  </div>
</div>
<div id="app-shell"></div>
<div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast}from'./assets/app.js';
const loader=document.querySelector('#page-loader');
const hideLoader=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
const esc=escapeHtml;
const withTimeout=(promise,ms=10000)=>Promise.race([
  promise,
  new Promise((_,reject)=>setTimeout(()=>reject(new Error('The profile request timed out. Please refresh and try again.')),ms))
]);
let user;
const initials=name=>String(name||'Teacher').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const signedPhoto=async path=>{
  if(!path)return'';
  const value=String(path).trim();
  if(/^https?:\/\//i.test(value))return value;
  try{
    const{data,error}=await withTimeout(
      supabase.storage.from('teacher-photos').createSignedUrl(value,3600),
      7000
    );
    if(!error&&data?.signedUrl)return data.signedUrl;
  }catch(e){console.warn('Teacher photo signed URL failed:',e)}
  try{
    const{data}=supabase.storage.from('teacher-photos').getPublicUrl(value);
    return data?.publicUrl||'';
  }catch{return''}
};

const render=(html)=>{const shell=document.querySelector('#app-shell');shell.dataset.content=html;mountShell(user)};
async function load(){
  const{data:t,error:te}=await withTimeout(
    supabase.from('teachers').select('id,staff_id,full_name,email,school_email,secondary_email,email_confirmation_mode,email_confirmed,email_confirmation_expires_at,phone,photo_url,is_active,created_at').eq('user_id',user.id).maybeSingle(),
    10000
  );
  if(te)throw te;
  if(!t)throw new Error('Your teacher profile could not be found.');
  user.teacher={...user.teacher,...t};
  const withTimeout=(promise,ms=8000)=>Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Request timed out')),ms))
  ]);
  let assignments=[],term=null;
  const [assignmentResult,termResult]=await Promise.allSettled([
    withTimeout(supabase.from('class_subjects').select('id,class_id,subject_id,classes(name,level),subjects(name,code,is_active)').eq('teacher_id',t.id).order('id')),
    withTimeout(supabase.from('terms').select('id,name,academic_sessions(name)').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle())
  ]);
  if(assignmentResult.status==='fulfilled'&&!assignmentResult.value.error){
    assignments=assignmentResult.value.data||[];
  }else if(assignmentResult.status==='rejected'){
    console.warn('Teacher assignments could not be loaded:',assignmentResult.reason);
  }else{
    console.warn('Teacher assignments query failed:',assignmentResult.value.error);
  }
  if(termResult.status==='fulfilled'&&!termResult.value.error){
    term=termResult.value.data||null;
  }else if(termResult.status==='rejected'){
    console.warn('Current term could not be loaded:',termResult.reason);
  }else{
    console.warn('Current term query failed:',termResult.value.error);
  }
  const rows=(assignments||[]).filter(x=>x.classes&&x.subjects?.is_active!==false);
  const photo=await signedPhoto(t.photo_url);
  const name=t.full_name||'Teacher';
  render(`<div class="profile-page">
    <section class="profile-hero">
      <div class="profile-hero-inner">
        <div class="profile-avatar">${photo?`<img src="${esc(photo)}" alt="${esc(name)}">`:esc(initials(name))}</div>
        <div>
          <div class="profile-kicker">TEACHER PROFILE</div>
          <h2>${esc(name)}</h2>
          <p>${esc(t.staff_id||'No Staff ID')} · Laff British Montessori School</p>
          <div class="profile-badges">
            <span class="profile-badge ${t.is_active?'':'status-inactive'}">${t.is_active?'Active Teacher':'Inactive Teacher'}</span>
            <span class="profile-badge">${esc(term?.name||'Current term not configured')}</span>
            <span class="profile-badge">${rows.length} teaching assignment${rows.length===1?'':'s'}</span>
          </div>
        </div>
      </div>
    </section>
    <div class="profile-grid">
      <section class="profile-card">
        <div class="profile-card-head"><div><h3>Personal & Contact Information</h3><p>Your information as recorded by the school.</p></div></div>
        <div class="info-list">
          <div class="info-row"><span>Full Name</span><strong>${esc(t.full_name||'—')}</strong></div>
          <div class="info-row"><span>Staff ID</span><strong>${esc(t.staff_id||'—')}</strong></div>
          <div class="info-row"><span>School Email</span><strong>${esc(t.school_email||t.email||'—')}</strong></div>
          <div class="info-row"><span>Secondary Email</span><strong>${esc(t.secondary_email||'Not provided')}</strong></div>
          <div class="info-row"><span>Phone</span><strong>${esc(t.phone||'Not provided')}</strong></div>
          <div class="info-row"><span>Account Email</span><strong>${esc(user.email||t.email||'—')}</strong></div>
          <div class="info-row"><span>Email Confirmation</span><strong>${t.email_confirmed?'Confirmed':t.email_confirmation_mode==='auto'?'Automatic confirmation':'Pending confirmation'}</strong></div>
          <div class="info-row"><span>Staff Status</span><strong class="${t.is_active?'status-active':'status-inactive'}">${t.is_active?'Active':'Inactive'}</strong></div>
          <div class="info-row"><span>Profile Created</span><strong>${t.created_at?new Date(t.created_at).toLocaleDateString():'—'}</strong></div>
        </div>
        <div class="profile-actions">
          <a class="btn secondary" href="classes.html">View My Classes</a>
          <a class="btn secondary" href="timetable.html">View Timetable</a>
        </div>
        <div class="profile-note">Teacher profile details are managed by the school administrator. Contact the school office when your name, staff ID, email or phone number needs to be changed.</div>
      </section>
      <section class="profile-card">
        <div class="profile-card-head"><div><h3>My Teaching Assignments</h3><p>Your current class and subject workload.</p></div></div>
        <div class="assignment-list">${rows.length?rows.map(a=>`<div class="assignment"><strong>${esc(a.classes?.name||'Class')}</strong><span>${esc(a.classes?.level||'')} · ${esc(a.subjects?.name||'Subject')}${a.subjects?.code?' · '+esc(a.subjects.code):''}</span></div>`).join(''):'<div class="profile-empty">No teaching assignments have been added yet.</div>'}</div>
      </section>
    </div>
  </div>`);
}
try{
  user=await withTimeout(requireTeacher(),12000);
  if(user)await load();
}catch(e){console.error(e);if(user){render(`<div class="profile-page"><section class="profile-card profile-empty"><h2>Profile could not be loaded</h2><p>${esc(e.message||'Please refresh and try again.')}</p><a class="btn" href="profile.html">Try Again</a></section></div>`)}toast(e.message||'Could not load your profile.','error')}finally{hideLoader()}
</script>
</body>
</html>
