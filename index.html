<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><link rel="stylesheet" href="assets/styles.css"></head><body data-title="Dashboard"><div id="app-shell" data-content="<div class='panel'><h2>Welcome to your teaching workspace</h2><p>Manage your assigned classes, results, attendance, timetable and school announcements.</p><div class='quick-grid'><a class='quick' href='classes.html'><b>My classes</b><span>View assigned classes and subjects.</span></a><a class='quick' href='results.html'><b>Enter results</b><span>Record and submit academic results.</span></a><a class='quick' href='attendance.html'><b>Take attendance</b><span>Record today's attendance.</span></a></div></div>"></div><div id="toast-host"></div><script type="module">import{requireTeacher,mountShell,supabase}from'./assets/app.js';async function consumeMagicLinkSession(){const hash=window.location.hash||'';if(!hash.includes('access_token='))return;const p=new URLSearchParams(hash.slice(1));const access_token=p.get('access_token');const refresh_token=p.get('refresh_token');if(access_token&&refresh_token){const{error}=await supabase.auth.setSession({access_token,refresh_token});if(error){console.error(error);return}history.replaceState(null,document.title,window.location.pathname+window.location.search)}}await consumeMagicLinkSession();const u=await requireTeacher();if(u)mountShell(u);</script></body></html>
