<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcements | Laff British Montessori School</title>
<meta name="description" content="School announcements and staff notices for Laff British Montessori School teachers.">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/portal-loader.css">
<style>
.ann-page{display:grid;gap:20px;max-width:1100px}
.ann-hero{position:relative;overflow:hidden;border-radius:26px;padding:26px;background:linear-gradient(135deg,#082b63,#0b5ed7);color:#fff;box-shadow:0 22px 50px rgba(8,43,99,.18)}
.ann-hero:after{content:'';position:absolute;width:270px;height:270px;right:-105px;top:-135px;border-radius:50%;border:42px solid rgba(244,194,13,.14)}
.ann-hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:end;gap:18px}
.ann-kicker{font-size:10px;font-weight:900;letter-spacing:.08em;color:#f8d84b}
.ann-hero h2{margin:8px 0 6px;font-size:29px}
.ann-hero p{margin:0;color:#dbe8ff;font-size:12px;line-height:1.55;max-width:700px}
.ann-count{padding:10px 13px;background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;font-size:10px;white-space:nowrap}
.ann-toolbar{display:flex;gap:10px;align-items:center;padding:14px;background:#fff;border:1px solid #e4eaf2;border-radius:18px;box-shadow:0 8px 25px rgba(20,45,80,.05)}
.ann-search{flex:1}
.ann-search input{width:100%;height:42px;margin:0;border:1px solid #dbe3ed;border-radius:11px;padding:0 12px;background:#fbfdff;color:#13233f;outline:none}
.ann-search input:focus{border-color:#0b5ed7;box-shadow:0 0 0 3px rgba(11,94,215,.1)}
.ann-list{display:grid;gap:12px}
.ann-card{background:#fff;border:1px solid #e4eaf2;border-radius:19px;padding:18px 20px;box-shadow:0 8px 25px rgba(20,45,80,.05)}
.ann-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ann-card h3{margin:0;color:#13233f;font-size:17px}
.ann-date{font-size:10px;color:#8a94a6;white-space:nowrap}
.ann-body{margin-top:9px;color:#5f6d81;font-size:12px;line-height:1.65;white-space:pre-wrap}
.ann-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.ann-tag{padding:6px 8px;border-radius:999px;background:#edf4ff;color:#0b5ed7;font-size:9px;font-weight:800}
.ann-empty{padding:35px 20px;text-align:center;color:#667085;background:#fff;border:1px dashed #dbe3ed;border-radius:18px}
.ann-empty strong{display:block;color:#13233f;font-size:14px;margin-bottom:5px}
@media(max-width:650px){.ann-hero-inner{align-items:flex-start;flex-direction:column}.ann-count{width:100%}.ann-toolbar{flex-direction:column;align-items:stretch}.ann-toolbar .btn{width:100%}.ann-card-head{flex-direction:column}.ann-date{white-space:normal}}
</style>
</head>
<body data-title="Announcements">
<div id="page-loader" class="lbs-loader" aria-live="polite">
  <div class="lbs-loader-card">
    <img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School">
    <div class="lbs-loader-ring"></div>
    <div class="lbs-loader-title">Opening Announcements</div>
    <div class="lbs-loader-text">Loading school notices…</div>
    <div class="lbs-loader-bar"></div>
    <div class="lbs-loader-dots"><span></span><span></span><span></span></div>
  </div>
</div>
<div id="app-shell"></div>
<div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast}from'./assets/app.js';
const loader=document.querySelector('#page-loader');
const hideLoader=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
const esc=escapeHtml;
let user,rows=[];
const safeDate=v=>v?new Date(v).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'';
const normalizeText=v=>String(v||'').trim();
function render(){
  const shell=document.querySelector('#app-shell');
  shell.dataset.content=`<div class="ann-page">
    <section class="ann-hero"><div class="ann-hero-inner"><div><div class="ann-kicker">SCHOOL UPDATES</div><h2>Announcements</h2><p>Read the latest notices and important messages published by the school for staff.</p></div><div class="ann-count"><span id="ann-count">0</span> notice(s)</div></div></section>
    <section class="ann-toolbar"><label class="ann-search"><input id="ann-search" type="search" placeholder="Search announcements…" autocomplete="off"></label><button id="ann-refresh" class="btn secondary" type="button">↻ Refresh</button></section>
    <section id="ann-list" class="ann-list"><div class="ann-empty"><strong>Loading announcements…</strong>Please wait.</div></section>
  </div>`;
  mountShell(user);
  document.querySelector('#ann-search')?.addEventListener('input',draw);
  document.querySelector('#ann-refresh')?.addEventListener('click',load);
}
function draw(){
  const box=document.querySelector('#ann-list');if(!box)return;
  const q=normalizeText(document.querySelector('#ann-search')?.value).toLowerCase();
  const filtered=rows.filter(item=>`${item.title||''} ${item.message||item.body||item.content||''}`.toLowerCase().includes(q));
  document.querySelector('#ann-count').textContent=filtered.length;
  box.innerHTML=filtered.length?filtered.map(item=>{
    const body=item.message??item.body??item.content??'';
    return `<article class="ann-card"><div class="ann-card-head"><h3>${esc(item.title||'School announcement')}</h3><time class="ann-date">${esc(safeDate(item.created_at||item.published_at))}</time></div>${body?`<div class="ann-body">${esc(body)}</div>`:''}<div class="ann-meta"><span class="ann-tag">Staff Notice</span></div></article>`;
  }).join(''):'<div class="ann-empty"><strong>No announcements found</strong>There are no notices matching your search.</div>';
}
async function load(){
  const box=document.querySelector('#ann-list');if(box)box.innerHTML='<div class="ann-empty"><strong>Loading announcements…</strong>Please wait.</div>';
  let result=await supabase.from('announcements').select('id,title,message,body,content,created_at,published_at,is_published').order('created_at',{ascending:false}).limit(50);
  if(result.error){
    result=await supabase.from('announcements').select('id,title,created_at').order('created_at',{ascending:false}).limit(50);
    if(result.error)throw result.error;
  }
  rows=(result.data||[]).filter(item=>item.is_published!==false);
  draw();
}
try{
  user=await requireTeacher();
  if(user){render();await load()}
}catch(e){
  console.error(e);
  if(user){
    const shell=document.querySelector('#app-shell');
    shell.dataset.content=`<div class="ann-page"><section class="ann-card ann-empty"><strong>Announcements could not be loaded</strong><p>${esc(e.message||'Please refresh and try again.')}</p><a class="btn" href="announcements.html">Try Again</a></section></div>`;
    mountShell(user);
  }
  toast(e.message||'Could not load announcements.','error');
}finally{hideLoader()}
</script>
</body>
</html>
