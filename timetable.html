<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Timetable | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/result-workspace.css">
<link rel="stylesheet" href="assets/portal-loader.css">
<style>
.tt-card{background:#fff;border:1px solid #e6ebf2;border-radius:20px;box-shadow:0 14px 36px rgba(20,43,78,.07);overflow:hidden;margin-top:16px}.tt-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 20px;border-bottom:1px solid #edf1f6;background:#fbfcfe}.tt-field label{display:block;color:#748197;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}.tt-field select,.tt-field input{width:100%;height:40px;border:1px solid #dbe3ed;border-radius:10px;padding:0 11px;background:#fff;color:#243650}.tt-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 20px}.tt-stat{padding:12px 14px;border:1px solid #edf1f6;border-radius:14px;background:#f8fafc}.tt-stat b{display:block;font-size:18px;color:#13233f}.tt-stat span{display:block;margin-top:3px;color:#8490a2;font-size:10px}.tt-days{padding:0 20px 20px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.tt-day{border:1px solid #e7edf5;border-radius:16px;overflow:hidden;background:#fff}.tt-day-head{padding:11px 12px;background:#f7f9fc;border-bottom:1px solid #e8edf4}.tt-day-head strong{display:block;color:#13233f;font-size:12px}.tt-day-head small{display:block;margin-top:3px;color:#8b97a8;font-size:9px}.tt-slot{padding:12px;border-bottom:1px solid #eef2f6}.tt-slot:last-child{border-bottom:0}.tt-time{font-size:9px;font-weight:900;color:#0b5ed7;letter-spacing:.03em}.tt-subject{margin-top:5px;font-size:12px;font-weight:900;color:#243650}.tt-class{margin-top:3px;color:#718096;font-size:10px}.tt-room{margin-top:7px;color:#94a0b2;font-size:9px}.tt-empty{padding:18px 12px;color:#97a3b5;font-size:10px;text-align:center}.tt-note{padding:0 20px 20px;color:#8490a2;font-size:10px}@media(max-width:980px){.tt-days{grid-template-columns:repeat(2,minmax(0,1fr))}.tt-toolbar{grid-template-columns:1fr}.tt-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.tt-days{grid-template-columns:1fr}}
</style>
</head>
<body data-title="My Timetable">
<div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Opening Timetable</div><div id="loader-text" class="lbs-loader-text">Loading your teaching schedule…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div>
<div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast}from'./assets/app.js';
const esc=escapeHtml,loader=document.querySelector('#page-loader'),loaderText=document.querySelector('#loader-text');let user,term,rows=[];
const hide=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};const setText=t=>{if(loaderText)loaderText.textContent=t};const withTimeout=async(request,label,ms=12000)=>{let timer;try{return await Promise.race([Promise.resolve(request),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(`${label} is taking too long. Please refresh and try again.`)),ms)})])}finally{clearTimeout(timer)}};
const days=[['Monday',1],['Tuesday',2],['Wednesday',3],['Thursday',4],['Friday',5]];
const fmtTime=v=>{if(!v)return'';const [h,m]=v.slice(0,5).split(':').map(Number),ap=h>=12?'PM':'AM',hh=h%12||12;return `${hh}:${String(m).padStart(2,'0')} ${ap}`};
function render(){const classOptions=[...new Map(rows.map(r=>[r.class_id,r.classes])).values()].sort((a,b)=>a.name.localeCompare(b.name));const subjectOptions=[...new Map(rows.map(r=>[r.subject_id,r.subjects])).values()].sort((a,b)=>a.name.localeCompare(b.name));const classes=classOptions.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.level?` · ${esc(c.level)}`:''}</option>`).join(''),subjects=subjectOptions.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');const total=rows.length,classesCount=classOptions.length,subjectsCount=subjectOptions.length,daysUsed=new Set(rows.map(r=>r.day_of_week)).size;mountShell(user);const shell=document.querySelector('#app-shell');shell.querySelector('.page-content').innerHTML=`<div class="form-page"><section class="form-hero"><div><span class="hero-kicker">TEACHING SCHEDULE</span><h2>My Timetable</h2><p>${esc(term.name)} · ${esc(term.academic_sessions?.name||'Academic Session')} · Published schedule for your assigned teaching periods.</p></div></section><section class="tt-card"><div class="tt-toolbar"><div class="tt-field"><label for="tt-class">Class</label><select id="tt-class"><option value="">All classes</option>${classes}</select></div><div class="tt-field"><label for="tt-subject">Subject</label><select id="tt-subject"><option value="">All subjects</option>${subjects}</select></div><div class="tt-field"><label for="tt-search">Search</label><input id="tt-search" type="search" placeholder="Search subject, class or room"></div></div><div class="tt-stats"><div class="tt-stat"><b id="stat-periods">${total}</b><span>Teaching periods</span></div><div class="tt-stat"><b>${classesCount}</b><span>Assigned classes</span></div><div class="tt-stat"><b>${subjectsCount}</b><span>Subjects</span></div><div class="tt-stat"><b>${daysUsed}</b><span>Days scheduled</span></div></div><div id="tt-days" class="tt-days"></div><div class="tt-note">Only published timetable entries assigned to your teacher profile are shown here.</div></section></div>`;const draw=()=>{const cls=document.querySelector('#tt-class').value,sub=document.querySelector('#tt-subject').value,q=document.querySelector('#tt-search').value.trim().toLowerCase();const filtered=rows.filter(r=>(!cls||r.class_id===cls)&&(!sub||r.subject_id===sub)&&(!q||`${r.subjects?.name||''} ${r.classes?.name||''} ${r.room||''}`.toLowerCase().includes(q))).sort((a,b)=>a.day_of_week-b.day_of_week||String(a.start_time).localeCompare(String(b.start_time)));document.querySelector('#stat-periods').textContent=filtered.length;document.querySelector('#tt-days').innerHTML=days.map(([name,num])=>{const day=filtered.filter(r=>Number(r.day_of_week)===num);return `<section class="tt-day"><div class="tt-day-head"><strong>${name}</strong><small>${day.length} ${day.length===1?'period':'periods'}</small></div>${day.length?day.map(r=>`<div class="tt-slot"><div class="tt-time">${esc(fmtTime(r.start_time))} – ${esc(fmtTime(r.end_time))}</div><div class="tt-subject">${esc(r.subjects?.name||'Subject')}</div><div class="tt-class">${esc(r.classes?.name||'Class')}${r.classes?.level?` · ${esc(r.classes.level)}`:''}</div><div class="tt-room">${r.room?`Room: ${esc(r.room)}`:'Room not specified'}</div></div>`).join(''):'<div class="tt-empty">No teaching period</div>'}</section>`}).join('')};['#tt-class','#tt-subject'].forEach(s=>document.querySelector(s).addEventListener('change',draw));document.querySelector('#tt-search').addEventListener('input',draw);draw()}
async function load(){setText('Checking the current academic term…');const{data:t,error:te}=await withTimeout(supabase.from('terms').select('id,name,session_id,academic_sessions(name)').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle(),'Loading the current term');if(te)throw te;if(!t)throw new Error('There is no current academic term configured.');term=t;setText('Loading your published teaching schedule…');const{data:r,error:re}=await withTimeout(supabase.from('timetables').select('id,class_id,session_id,term_id,day_of_week,start_time,end_time,subject_id,teacher_id,room,published,classes(id,name,level),subjects(id,name,code,is_active)').eq('term_id',term.id).eq('teacher_id',user.teacher.id).eq('published',true).order('day_of_week').order('start_time'),'Loading timetable entries');if(re)throw re;rows=(r||[]).filter(x=>x.classes&&x.subjects?.is_active);render()}
try{user=await requireTeacher();if(user){const{data:teacher,error}=await withTimeout(supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle(),'Verifying teacher profile');if(error)throw error;if(!teacher)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...teacher};await load()}}catch(e){console.error(e);if(user){mountShell(user);document.querySelector('#app-shell .page-content').innerHTML=`<div class="form-page"><section class="score-card"><span class="hero-kicker">MY TIMETABLE</span><h2>Timetable could not be loaded</h2><p style="color:#667085">${esc(e.message||'Please try again.')}</p><a class="btn" href="timetable.html">Try Again</a></section></div>`}toast(e.message||'Could not load the timetable.','error')}finally{hide()}
</script>
</body>
</html>
