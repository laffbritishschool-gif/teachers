<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter Results | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/result-workspace.css"></head><body data-title="Enter Results"><div id="page-loader" class="page-loader active"><div class="loader-box"><img class="loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="loader-spinner"></div><strong>Loading result workspace</strong><span>Preparing your classes and students…</span></div></div><div id="app-shell"></div><div id="toast-host"></div><script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast}from'./assets/app.js';
const esc=escapeHtml, params=new URLSearchParams(location.search), requestedClass=params.get('class'), requestedSubject=params.get('subject');
const loader=document.querySelector('#page-loader');const hideLoader=()=>{loader?.classList.remove('active');setTimeout(()=>loader?.remove(),300)};
let user,term,assignments=[],students=[];
const initials=(a,b)=>`${(a||'')[0]||''}${(b||'')[0]||''}`.toUpperCase();
function render(html){const s=document.querySelector('#app-shell');s.dataset.content=html;mountShell(user);}
function statusBadge(status){const s=String(status||'').toUpperCase();const map={DRAFT:['status-draft','Draft'],SUBMITTED:['status-submitted','Submitted to Admin'],PUBLISHED:['status-published','Published']};const [c,l]=map[s]||['status-none','No Result'];return `<span class="result-status ${c}"><span class="status-dot"></span>${l}</span>`}
function actionFor(row){if(!row.result)return `<a class="btn" href="add-result.html?studentid=${encodeURIComponent(row.studentId)}&classid=${encodeURIComponent(row.classId)}&subjectid=${encodeURIComponent(row.subjectId)}">+ Add Result</a>`;if(row.result.status==='DRAFT')return `<a class="btn" href="edit-result.html?studentid=${encodeURIComponent(row.studentId)}&classid=${encodeURIComponent(row.classId)}&subjectid=${encodeURIComponent(row.subjectId)}&resultid=${encodeURIComponent(row.result.id)}">Edit Result</a>`;return `<span class="submission-note">Result already submitted to admin.</span>`}
async function load(){
 document.body.classList.add('results-page');
 const {data:teacher,error:te}=await supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle();if(te||!teacher)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...teacher};
 const {data:currentTerm,error:termError}=await supabase.from('terms').select('id,name,session_id,academic_sessions(name)').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle();if(termError)throw termError;if(!currentTerm)throw new Error('There is no current academic term configured.');term=currentTerm;
 const {data:cs,error:ce}=await supabase.from('class_subjects').select('id,class_id,subject_id,classes(id,name,level),subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).order('id');if(ce)throw ce;
 assignments=(cs||[]).filter(x=>x.classes&&x.subjects&&x.subjects.is_active);
 render(`<div class="results-page"><section class="results-hero"><span class="hero-kicker">ACADEMIC RESULTS</span><h2>Enter Student Results</h2><p>Select one of your assigned classes and subjects, then choose the student whose result you want to add or edit.</p></section><section class="result-toolbar"><div class="result-field"><label for="class-select">Class</label><select id="class-select"></select></div><div class="result-field"><label for="subject-select">Subject</label><select id="subject-select"></select></div><div class="result-field"><label for="student-search">Search student</label><input id="student-search" class="result-search" type="search" placeholder="Search by name or student ID"></div><button class="btn secondary" id="refresh-students" type="button">↻ Refresh</button></section><div id="result-summary" class="result-summary"></div><section class="student-picker"><div class="student-picker-head"><div><h3>Select a student</h3><p>Current term: <b>${esc(term.name)} · ${esc(term.academic_sessions?.name||'Academic Session')}</b></p></div></div><div id="student-list" class="student-list"><div class="empty-state-rw">Loading students…</div></div></section></div>`);
 setupSelectors();await loadStudents();document.querySelector('#refresh-students').onclick=loadStudents;document.querySelector('#student-search').addEventListener('input',renderStudents);
}
function setupSelectors(){
 const classes=[...new Map(assignments.map(x=>[x.class_id,x.classes])).values()].sort((a,b)=>a.name.localeCompare(b.name));const cls=document.querySelector('#class-select');const subj=document.querySelector('#subject-select');cls.innerHTML=classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.level?` · ${esc(c.level)}`:''}</option>`).join('');let classValue=requestedClass&&classes.some(c=>c.id===requestedClass)?requestedClass:classes[0]?.id;cls.value=classValue||'';populateSubjects();if(requestedSubject&&[...subj.options].some(o=>o.value===requestedSubject))subj.value=requestedSubject;cls.onchange=()=>{populateSubjects();loadStudents()};subj.onchange=loadStudents;
}
function populateSubjects(){const cls=document.querySelector('#class-select')?.value;const subj=document.querySelector('#subject-select');const rows=assignments.filter(x=>x.class_id===cls);subj.innerHTML=rows.map(x=>`<option value="${esc(x.subject_id)}">${esc(x.subjects.name)}${x.subjects.code?` (${esc(x.subjects.code)})`:''}</option>`).join('');}
async function loadStudents(){
 const box=document.querySelector('#student-list');if(!box)return;box.innerHTML='<div class="empty-state-rw">Loading students…</div>';const classId=document.querySelector('#class-select')?.value,subjectId=document.querySelector('#subject-select')?.value;if(!classId||!subjectId){box.innerHTML='<div class="empty-state-rw">Select a class and subject to continue.</div>';return}
 const assignment=assignments.find(x=>x.class_id===classId&&x.subject_id===subjectId);if(!assignment){box.innerHTML='<div class="empty-state-rw">This subject is not assigned to you for the selected class.</div>';return}
 try{const {data:en,error:e}=await supabase.from('enrollments').select('id,student_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url,date_of_birth,gender,school_email,phone,guardian_name,guardian_phone),classes(id,name,level)').eq('class_id',classId).eq('status','ACTIVE').order('created_at');if(e)throw e;students=en||[];const ids=students.map(x=>x.id);let results=[];if(ids.length){const {data:r,error:re}=await supabase.from('results').select('id,enrollment_id,status,ca_score,exam_score,total,grade,teacher_remark').eq('term_id',term.id).eq('subject_id',subjectId).in('enrollment_id',ids);if(re)throw re;results=r||[]}const by=new Map(results.map(r=>[r.enrollment_id,r]));students=students.map(x=>({...x,result:by.get(x.id)||null,classId,subjectId,studentId:x.students?.id}));renderStudents();updateSummary();}catch(e){console.error(e);box.innerHTML='<div class="empty-state-rw">Students could not be loaded. Please refresh and try again.</div>';toast('Students could not be loaded.','error')}}
function updateSummary(){const s=students||[];const existing=s.filter(x=>x.result);const submitted=existing.filter(x=>String(x.result?.status).toUpperCase()==='SUBMITTED');const drafts=existing.filter(x=>String(x.result?.status).toUpperCase()==='DRAFT');const none=s.length-existing.length;document.querySelector('#result-summary').innerHTML=`<span class="result-chip">${s.length} students</span><span class="result-chip">${none} awaiting result</span><span class="result-chip">${drafts} draft</span><span class="result-chip">${submitted} submitted</span>`}
function renderStudents(){const box=document.querySelector('#student-list');if(!box)return;const q=(document.querySelector('#student-search')?.value||'').trim().toLowerCase();const rows=(students||[]).filter(x=>{const s=x.students||{};return !q||`${s.first_name||''} ${s.middle_name||''} ${s.last_name||''} ${s.student_id||''} ${s.exam_number||''}`.toLowerCase().includes(q)});box.innerHTML=rows.length?rows.map(x=>{const s=x.students||{};const name=`${s.first_name||''} ${s.middle_name||''} ${s.last_name||''}`.replace(/\s+/g,' ').trim();return `<article class="student-row"><div class="student-main"><div class="student-avatar">${s.photo_url?`<img src="${esc(s.photo_url)}" alt="">`:esc(initials(s.first_name,s.last_name))}</div><div class="student-info"><strong>${esc(name||'Unnamed student')}</strong><span>${esc(s.student_id||'No student ID')}${s.exam_number?` · Exam ${esc(s.exam_number)}`:''}</span><span class="student-subject">${statusBadge(x.result?.status)}${x.result?.total!=null?` · Total ${esc(x.result.total)}`:''}</span></div></div><div class="result-actions">${statusBadge(x.result?.status)}${actionFor(x)}</div></article>`}).join(''):'<div class="empty-state-rw">No students match your search.</div>'}
try{user=await requireTeacher();if(user)await load();}catch(e){console.error(e);toast(e.message||'Could not load the result workspace.','error')}finally{hideLoader()}
</script></body></html>
