<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter Results | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/result-workspace.css"><link rel="stylesheet" href="assets/portal-loader.css">
<style>
.results-page{display:grid;gap:17px}.results-hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,#082b63,#0b5ed7);color:#fff}.results-hero h2{margin:9px 0 5px;font-size:27px}.results-hero p{margin:0;color:#dce8fb;font-size:12px}.result-filter-panel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:17px;background:#fff;border:1px solid #e3e9f2;border-radius:17px}.result-filter-panel label{display:grid;gap:7px;color:#667085;font-size:11px;font-weight:800}.result-filter-panel select,.result-filter-panel input{width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border:1px solid #dce4ef;border-radius:10px;background:#fff;color:#13233f;font:inherit}.result-toolbar-actions{display:flex;align-items:end}.result-summary{display:flex;gap:8px;flex-wrap:wrap}.result-chip{padding:7px 11px;border:1px solid #e3e9f2;border-radius:99px;background:#fff;color:#475467;font-size:11px}.student-picker{display:grid;gap:12px}.student-picker-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.student-picker-head h3{margin:0}.student-picker-head p{margin:5px 0 0;color:#667085;font-size:11px}.student-list{display:grid;gap:10px}.student-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px;background:#fff;border:1px solid #e3e9f2;border-radius:15px}.student-main{display:flex;align-items:center;gap:12px;min-width:0}.student-avatar{width:43px;height:43px;flex:0 0 43px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#edf3ff;color:#174ea6;font-weight:800}.student-avatar img{width:100%;height:100%;object-fit:cover}.student-info{display:grid;gap:4px;min-width:0}.student-info strong{color:#172b4d;font-size:13px}.student-info>span{color:#667085;font-size:10px}.student-subject{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.student-progress{font-size:10px;color:#667085}.result-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.subject-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.subject-links a{font-size:10px;color:#0b5ed7;text-decoration:none;padding:4px 7px;border-radius:7px;background:#f1f6ff}.subject-links a:hover{text-decoration:underline}.empty-state-rw{padding:24px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px;color:#667085;font-size:12px}.results-help{padding:13px 15px;border-radius:12px;background:#f4f7fc;color:#667085;font-size:11px;line-height:1.6}@media(max-width:760px){.result-filter-panel{grid-template-columns:1fr 1fr}.student-row{align-items:flex-start;flex-direction:column}.result-actions{width:100%;justify-content:flex-start}}@media(max-width:520px){.result-filter-panel{grid-template-columns:1fr}.results-hero h2{font-size:23px}}
</style></head><body data-title="Enter Results"><div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Opening Enter Results</div><div class="lbs-loader-text">Preparing your academic result workspace…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div><div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast}from'./assets/app.js';
const esc=escapeHtml,params=new URLSearchParams(location.search),requestedClass=params.get('class');
const loader=document.querySelector('#page-loader');const hideLoader=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
let user,sessions=[],terms=[],assignments=[],students=[],selectedSession='',selectedTerm='',selectedClass='';
const initials=(a,b)=>((a||'')[0]||'')+((b||'')[0]||'').toUpperCase();
function render(html){const s=document.querySelector('#app-shell');s.dataset.content=html;mountShell(user)}
function statusBadge(status){const s=String(status||'').toUpperCase(),map={DRAFT:['status-draft','Draft'],SUBMITTED:['status-submitted','Submitted'],PUBLISHED:['status-published','Published']},[c,l]=map[s]||['status-none','Not entered'];return '<span class="result-status '+c+'"><span class="status-dot"></span>'+l+'</span>'}
function classOptions(){const classes=[...new Map(assignments.map(x=>[x.class_id,x.classes])).values()].sort((a,b)=>a.name.localeCompare(b.name));return classes}
function renderPage(){const classes=classOptions();render('<div class="results-page"><section class="results-hero"><span class="hero-kicker">ACADEMIC RESULTS</span><h2>Student Results</h2><p>Choose an academic session and term, then select a class to view students and enter their subject results.</p></section><section class="result-filter-panel"><label>Academic Session<select id="session-select"><option value="">Select academic session</option>'+sessions.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Term / Examination<select id="term-select" disabled><option value="">Select session first</option></select></label><label>Class<select id="class-select" disabled><option value="">Select term first</option></select></label><label>Search student<input id="student-search" type="search" placeholder="Name, student ID or exam number"></label><div class="result-toolbar-actions"><button class="btn secondary" id="refresh-students" type="button" disabled>↻ Refresh list</button></div></section><div id="result-summary" class="result-summary"></div><section class="student-picker"><div class="student-picker-head"><div><h3>Students in selected class</h3><p id="selection-caption">Select a session, term and class to continue.</p></div></div><div id="student-list" class="student-list"><div class="empty-state-rw">Choose an academic session, term and class above.</div></div></section><div class="results-help">Each student can have multiple subject results in the selected term. Open <b>Add / Continue Results</b> to choose subjects, enter CA and examination scores, and submit only those selected subjects. Results from other terms are kept separate.</div></div>');
const ss=document.querySelector('#session-select'),ts=document.querySelector('#term-select'),cs=document.querySelector('#class-select');ss.value=selectedSession;ss.onchange=()=>{selectedSession=ss.value;selectedTerm='';selectedClass='';populateTerms()};ts.onchange=()=>{selectedTerm=ts.value;selectedClass='';populateClasses()};cs.onchange=()=>{selectedClass=cs.value;loadStudents()};document.querySelector('#student-search').oninput=renderStudents;document.querySelector('#refresh-students').onclick=loadStudents}
function populateTerms(){const ts=document.querySelector('#term-select'),cs=document.querySelector('#class-select');const rows=terms.filter(x=>String(x.session_id)===String(selectedSession));ts.disabled=!selectedSession;ts.innerHTML='<option value="">Select term / examination</option>'+rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');cs.disabled=true;cs.innerHTML='<option value="">Select term first</option>';document.querySelector('#student-list').innerHTML='<div class="empty-state-rw">Now choose a term.</div>';document.querySelector('#selection-caption').textContent='Select a term to continue.';document.querySelector('#refresh-students').disabled=true}
function populateClasses(){const cs=document.querySelector('#class-select'),classes=classOptions();cs.disabled=!selectedTerm;cs.innerHTML='<option value="">Select class</option>'+classes.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+(c.level?' · '+esc(c.level):'')+'</option>').join('');if(requestedClass&&classes.some(c=>c.id===requestedClass)){cs.value=requestedClass;requestedClass=null;selectedClass=cs.value;loadStudents()}else{selectedClass='';document.querySelector('#student-list').innerHTML='<div class="empty-state-rw">Select a class to load its students.</div>';document.querySelector('#selection-caption').textContent='Choose a class for the selected term.';document.querySelector('#refresh-students').disabled=true}}
async function loadStudents(){const box=document.querySelector('#student-list');if(!box)return;box.innerHTML='<div class="empty-state-rw">Loading students and their result status…</div>';document.querySelector('#refresh-students').disabled=true;try{if(!selectedSession||!selectedTerm||!selectedClass)throw new Error('Select session, term and class first.');const{data:en,error:e}=await supabase.from('enrollments').select('id,student_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url),classes(id,name,level)').eq('class_id',selectedClass).eq('status','ACTIVE').order('created_at');if(e)throw e;const enrollments=en||[],ids=enrollments.map(x=>x.id);let results=[];if(ids.length){const{data:r,error:re}=await supabase.from('results').select('id,enrollment_id,subject_id,status,ca_score,exam_score,total,grade').eq('term_id',selectedTerm).in('enrollment_id',ids);if(re)throw re;results=r||[]}const subjectRows=assignments.filter(x=>x.class_id===selectedClass),subjectMap=new Map(subjectRows.map(x=>[x.subject_id,x.subjects]));const grouped=new Map();for(const r of results){if(!grouped.has(r.enrollment_id))grouped.set(r.enrollment_id,[]);grouped.get(r.enrollment_id).push(r)}students=enrollments.map(enrollment=>({...enrollment,results:grouped.get(enrollment.id)||[],subjectMap,classId:selectedClass,studentId:enrollment.students?.id}));document.querySelector('#selection-caption').textContent=(sessions.find(x=>x.id===selectedSession)?.name||'')+' · '+(terms.find(x=>x.id===selectedTerm)?.name||'')+' · '+(enrollments[0]?.classes?.name||classesName(selectedClass));document.querySelector('#refresh-students').disabled=false;renderStudents();updateSummary()}catch(e){console.error(e);box.innerHTML='<div class="empty-state-rw">'+esc(e.message||'Students could not be loaded. Please refresh and try again.')+'</div>';toast(e.message||'Students could not be loaded.','error')}}
function classesName(id){return classOptions().find(x=>x.id===id)?.name||'Selected class'}
function updateSummary(){const total=students.length,all=students.reduce((n,x)=>n+x.results.length,0),submitted=students.reduce((n,x)=>n+x.results.filter(r=>String(r.status).toUpperCase()==='SUBMITTED').length,0),drafts=students.reduce((n,x)=>n+x.results.filter(r=>String(r.status).toUpperCase()==='DRAFT').length,0),published=students.reduce((n,x)=>n+x.results.filter(r=>String(r.status).toUpperCase()==='PUBLISHED').length,0);document.querySelector('#result-summary').innerHTML='<span class="result-chip">'+total+' students</span><span class="result-chip">'+all+' subject results entered</span><span class="result-chip">'+drafts+' drafts</span><span class="result-chip">'+submitted+' submitted</span><span class="result-chip">'+published+' published</span>'}
function renderStudents(){const box=document.querySelector('#student-list');if(!box)return;const q=(document.querySelector('#student-search')?.value||'').trim().toLowerCase();const rows=students.filter(x=>{const s=x.students||{};return !q||[s.first_name,s.middle_name,s.last_name,s.student_id,s.exam_number].filter(Boolean).join(' ').toLowerCase().includes(q)});box.innerHTML=rows.length?rows.map(x=>{const s=x.students||{},name=[s.first_name,s.middle_name,s.last_name].filter(Boolean).join(' '),count=x.results.length,available=assignments.filter(a=>a.class_id===selectedClass&&!x.results.some(r=>r.subject_id===a.subject_id)),links=x.results.map(r=>'<a href="edit-result.html?studentid='+encodeURIComponent(x.studentId)+'&classid='+encodeURIComponent(x.classId)+'&subjectid='+encodeURIComponent(r.subject_id)+'&resultid='+encodeURIComponent(r.id)+'">'+esc(x.subjectMap.get(r.subject_id)?.name||'Subject')+' · '+esc(r.status||'Saved')+'</a>').join('');return '<article class="student-row"><div class="student-main"><div class="student-avatar">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'" alt="">':esc(initials(s.first_name,s.last_name)))+'</div><div class="student-info"><strong>'+esc(name||'Unnamed student')+'</strong><span>'+esc(s.student_id||'No student ID')+(s.exam_number?' · Exam '+esc(s.exam_number):'')+'</span><span class="student-progress">'+count+' of '+assignments.filter(a=>a.class_id===selectedClass).length+' assigned subject(s) recorded · '+available.length+' remaining</span>'+(links?'<div class="subject-links">'+links+'</div>':'')+'</div></div><div class="result-actions">'+(available.length?'<a class="btn" href="add-result.html?studentid='+encodeURIComponent(x.studentId)+'&classid='+encodeURIComponent(x.classId)+'">+ Add / Continue Results</a>':'<span class="result-status status-published">All subjects recorded</span>')+'</div></article>'}).join(''):'<div class="empty-state-rw">No students match your search.</div>'}
async function load(){document.body.classList.add('results-page');const{data:teacher,error:te}=await supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle();if(te||!teacher)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...teacher};const{data:ss,error:se}=await supabase.from('academic_sessions').select('id,name');if(se)throw se;sessions=ss||[];const{data:tt,error:te2}=await supabase.from('terms').select('id,name,session_id,starts_on').order('starts_on',{ascending:true});if(te2)throw te2;terms=tt||[];const{data:cs,error:ce}=await supabase.from('class_subjects').select('id,class_id,subject_id,classes(id,name,level),subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).order('id');if(ce)throw ce;assignments=(cs||[]).filter(x=>x.classes&&x.subjects&&x.subjects.is_active).filter((x,i,a)=>a.findIndex(y=>y.class_id===x.class_id&&y.subject_id===x.subject_id)===i);if(!sessions.length)throw new Error('No academic sessions have been configured.');if(!terms.length)throw new Error('No terms have been configured.');if(!assignments.length)throw new Error('No active classes or subjects are assigned to you.');renderPage()}
try{user=await requireTeacher();if(user)await load()}catch(e){console.error(e);toast(e.message||'Could not load the result workspace.','error')}finally{hideLoader()}
</script></body></html>
