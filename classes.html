<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Classes & Subjects | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/classes.css"><link rel="stylesheet" href="assets/portal-loader.css"></head><body class="classes-page" data-title="My Classes & Subjects"><div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Loading My Classes</div><div class="lbs-loader-text">Preparing your teaching assignments…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div><div id="app-shell"></div><div id="toast-host"></div><script type="module">
import { requireTeacher, mountShell, supabase, escapeHtml, toast } from './assets/app.js';
const loader=document.querySelector('#page-loader');const hideLoader=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
async function loadClasses(user){const shell=document.querySelector('#app-shell');shell.dataset.content=`<div class="classes-content"><section class="classes-hero"><div class="classes-hero-inner"><div class="classes-hero-copy"><span class="classes-kicker">My Teaching Workspace</span><h2>My Classes & Subjects</h2><p>See every class and subject assigned to you, then move straight into attendance or results work.</p></div><div class="classes-term"><span>Current term</span><strong id="current-term">Loading…</strong></div></div></section><section class="classes-summary"><article class="classes-stat"><span class="classes-stat-label">Classes</span><strong id="summary-classes" class="classes-stat-value">—</strong><span class="classes-stat-meta">Class groups assigned to you</span></article><article class="classes-stat"><span class="classes-stat-label">Subjects</span><strong id="summary-subjects" class="classes-stat-value">—</strong><span class="classes-stat-meta">Unique subjects you teach</span></article><article class="classes-stat"><span class="classes-stat-label">Assignments</span><strong id="summary-assignments" class="classes-stat-value">—</strong><span class="classes-stat-meta">Class + subject combinations</span></article><article class="classes-stat"><span class="classes-stat-label">Students</span><strong id="summary-students" class="classes-stat-value">—</strong><span class="classes-stat-meta">Students across assigned classes</span></article></section><section class="classes-controls"><label class="classes-search"><span>⌕</span><input id="assignment-search" type="search" placeholder="Search class or subject…" autocomplete="off"></label><div class="classes-filter-wrap"><select id="level-filter" class="classes-filter"><option value="">All levels</option></select></div><div id="results-note" class="classes-results-note">Loading assignments…</div></section><section class="classes-layout"><div class="classes-panel"><div class="classes-panel-head"><div><h3>Your assigned classes</h3><p>Each class is grouped with the subjects you teach there.</p></div><button id="refresh-classes" class="btn secondary" type="button">Refresh</button></div><div id="class-groups" class="class-groups"><div class="classes-empty">Loading your teaching assignments…</div></div></div><div class="classes-side-stack"><section class="classes-panel"><div class="classes-panel-head"><div><h3>Subject overview</h3><p>Your subjects across all assigned classes.</p></div></div><div id="subject-overview" class="subject-overview"><div class="classes-empty">Loading subjects…</div></div></section><section class="classes-tip"><b>Teaching tip</b><p>Keep attendance and results up to date after each class. Use the quick actions on an assignment to continue without searching again.</p></section></div></section></div>`;mountShell(user);let assignments=[],enrolments=[];const classGroups=document.querySelector('#class-groups'),subjectOverview=document.querySelector('#subject-overview'),search=document.querySelector('#assignment-search'),levelFilter=document.querySelector('#level-filter'),resultsNote=document.querySelector('#results-note');function render(){const query=search.value.trim().toLowerCase(),level=levelFilter.value,filtered=assignments.filter(x=>{const haystack=`${x.class_name} ${x.level} ${x.subject_name} ${x.subject_code}`.toLowerCase();return(!query||haystack.includes(query))&&(!level||x.level===level)}),grouped=new Map();filtered.forEach(x=>{if(!grouped.has(x.class_id))grouped.set(x.class_id,{class_id:x.class_id,class_name:x.class_name,level:x.level,subjects:[]});grouped.get(x.class_id).subjects.push(x)});resultsNote.textContent=`${filtered.length} assignment${filtered.length===1?'':'s'} shown`;classGroups.innerHTML=grouped.size?Array.from(grouped.values()).map(g=>{const studentCount=new Set(enrolments.filter(e=>e.class_id===g.class_id).map(e=>e.student_id)).size;return `<article class="class-group"><div class="class-group-top"><div class="class-group-title"><div class="class-mark">${escapeHtml(g.class_name.slice(0,1).toUpperCase())}</div><div><h4>${escapeHtml(g.class_name)}</h4><div class="class-level">${escapeHtml(g.level||'School class')}</div></div></div><span class="class-size">${studentCount} student${studentCount===1?'':'s'}</span></div><div class="subject-list">${g.subjects.map(s=>`<div class="subject-row"><div class="subject-info"><span class="subject-dot"></span><div><span class="subject-name">${escapeHtml(s.subject_name)}<span class="subject-code">${escapeHtml(s.subject_code||'')}</span></span></div></div><div class="subject-actions"><a class="subject-action" href="attendance.html?class=${encodeURIComponent(s.class_id)}">Attendance</a><a class="subject-action" href="results.html?class=${encodeURIComponent(s.class_id)}&subject=${encodeURIComponent(s.subject_id)}">Results</a></div></div>`).join('')}</div><div class="class-footer"><a class="btn secondary" href="attendance.html?class=${encodeURIComponent(g.class_id)}">Mark class attendance</a></div></article>`}).join(''):`<div class="classes-empty"><strong>No matching assignments</strong>${assignments.length?'Try a different search or level filter.':'Your class and subject assignments have not been added yet.'}</div>`}function renderSubjectOverview(){const map=new Map();assignments.forEach(x=>{if(!map.has(x.subject_id))map.set(x.subject_id,{name:x.subject_name,code:x.subject_code||'',classes:[]});map.get(x.subject_id).classes.push(x.class_name)});subjectOverview.innerHTML=map.size?Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<div class="subject-overview-item"><div><b>${escapeHtml(s.name)}</b><span>${escapeHtml(s.code)}</span></div><span>${s.classes.length} class${s.classes.length===1?'':'es'}</span></div>`).join(''):'<div class="classes-empty">No subjects assigned yet.</div>'}async function fetchData(){classGroups.innerHTML='<div class="classes-empty">Loading your teaching assignments…</div>';try{const{data,error}=await supabase.from('class_subjects').select('id,class_id,subject_id,classes(id,name,level),subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).order('id');if(error)throw error;assignments=(data||[]).filter(x=>x.subjects?.is_active!==false).map(x=>({id:x.id,class_id:x.class_id,subject_id:x.subject_id,class_name:x.classes?.name||'Class',level:x.classes?.level||'School class',subject_name:x.subjects?.name||'Subject',subject_code:x.subjects?.code||'',max_ca:x.subjects?.max_ca,max_exam:x.subjects?.max_exam}));const classIds=[...new Set(assignments.map(x=>x.class_id))];if(classIds.length){const{data:enrolData}=await supabase.from('enrollments').select('id,student_id,class_id,status').in('class_id',classIds);enrolments=(enrolData||[]).filter(x=>String(x.status||'').toUpperCase()==='ACTIVE')}else enrolments=[];const{data:termData}=await supabase.from('terms').select('id,name,is_current,starts_on,ends_on').eq('is_current',true).maybeSingle();document.querySelector('#current-term').textContent=termData?.name||'Current term';document.querySelector('#summary-classes').textContent=new Set(assignments.map(x=>x.class_id)).size;document.querySelector('#summary-subjects').textContent=new Set(assignments.map(x=>x.subject_id)).size;document.querySelector('#summary-assignments').textContent=assignments.length;document.querySelector('#summary-students').textContent=enrolments.length?new Set(enrolments.map(x=>x.student_id)).size:0;const levels=[...new Set(assignments.map(x=>x.level).filter(Boolean))].sort();levelFilter.innerHTML='<option value="">All levels</option>'+levels.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');renderSubjectOverview();render()}catch(e){console.error(e);classGroups.innerHTML='<div class="classes-empty"><strong>We could not load your assignments</strong>Please refresh the page and try again.</div>';resultsNote.textContent='Assignments unavailable';toast('Your class assignments could not be loaded.','error')}}search.addEventListener('input',render);levelFilter.addEventListener('change',render);document.querySelector('#refresh-classes').addEventListener('click',async()=>{await fetchData();toast('Classes and subjects refreshed.')});await fetchData();hideLoader()}const user=await requireTeacher();if(user)await loadClasses(user);
</script></body></html>
