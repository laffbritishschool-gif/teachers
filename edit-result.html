<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Result | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/result-workspace.css">
<link rel="stylesheet" href="assets/portal-loader.css">
<style>
.result-sheet-card{background:#fff;border:1px solid #e6ebf2;border-radius:20px;box-shadow:0 14px 36px rgba(20,43,78,.07);overflow:hidden;margin-top:16px}.result-sheet-head{padding:18px 20px;border-bottom:1px solid #edf1f6;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.result-sheet-head h3{margin:0;color:#13233f;font-size:16px}.result-sheet-head p{margin:5px 0 0;color:#718096;font-size:11px}.result-table-wrap{overflow:auto}.result-table{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}.result-table th{background:#f7f9fc;color:#687386;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;padding:12px 10px;border-bottom:1px solid #e9eef5;text-align:left;white-space:nowrap}.result-table td{padding:11px 10px;border-bottom:1px solid #eef2f6;font-size:12px;color:#26354d;vertical-align:middle}.result-table tbody tr:last-child td{border-bottom:0}.result-table tbody tr.selected-row{background:#f8fbff}.result-table tbody tr.selected-row td:first-child{box-shadow:inset 3px 0 0 #0b5ed7}.subject-name{font-weight:800;color:#13233f}.subject-code{display:block;color:#97a3b5;font-size:10px;margin-top:3px}.result-number{font-weight:800}.result-input{width:78px;height:34px;border:1px solid #a9c2e5;border-radius:9px;padding:0 9px;font-weight:800;color:#13233f;background:#fff;outline:none}.result-input:focus{border-color:#0b5ed7;box-shadow:0 0 0 3px rgba(11,94,215,.1)}.result-input:disabled{background:#f5f7fa;border-color:#e4e9f0;color:#94a0b2;cursor:not-allowed}.result-readonly{color:#718096}.selected-tag{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;background:#eaf2ff;color:#0b5ed7;font-size:9px;font-weight:900;margin-left:7px}.table-status{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}.table-status.draft{color:#a56a00}.table-status.submitted{color:#156f45}.table-status.published{color:#285ea8}.table-status.none{color:#9aa5b4}.save-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid #edf1f6;background:#fbfcfe}.save-note{color:#718096;font-size:11px;line-height:1.5}.save-actions{display:flex;gap:8px;flex-wrap:wrap}.student-overview{display:grid;grid-template-columns:74px 1fr;gap:16px;align-items:center}.overview-avatar{width:74px;height:74px;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:#edf3fb;color:#31527e;font-weight:900;font-size:22px}.overview-avatar img{width:100%;height:100%;object-fit:cover}.overview-name{margin:0;color:#13233f;font-size:18px}.overview-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.overview-chip{padding:6px 9px;border-radius:999px;background:#f4f7fb;color:#607087;font-size:10px;font-weight:800}.overview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}.overview-grid .detail-item{background:#f8fafc;border:1px solid #edf1f6;border-radius:12px;padding:10px}.overview-grid small{display:block;color:#94a0b2;font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}.overview-grid b{display:block;margin-top:4px;color:#243650;font-size:11px;word-break:break-word}.bulk-badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#eef8f2;color:#156f45;font-size:10px;font-weight:900}.result-locked{display:block;color:#98a3b3;font-size:9px;margin-top:4px;font-weight:700}@media(max-width:700px){.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.student-overview{grid-template-columns:58px 1fr}.overview-avatar{width:58px;height:58px;border-radius:14px}.overview-name{font-size:16px}}
</style>
</head>
<body data-title="Edit Result">
<div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Opening Result</div><div id="loader-text" class="lbs-loader-text">Verifying your teacher access…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div>
<div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import { requireTeacher, mountShell, supabase, escapeHtml, toast, getCachedSchoolSettings } from './assets/app.js';

const esc=escapeHtml;
const params=new URLSearchParams(location.search);
const studentIdParam=params.get('studentid')||params.get('id');
const classIdParam=params.get('classid')||params.get('class');
const subjectIdParam=params.get('subjectid')||params.get('subject');
const resultIdParam=params.get('resultid')||params.get('result');
const loader=document.querySelector('#page-loader');
const loaderText=document.querySelector('#loader-text');
let user,term,schoolSettings=getCachedSchoolSettings(),enrollment,subjects=[],resultMap=new Map(),selectedSubjectId=null;

const hideLoader=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
const setLoaderText=t=>{if(loaderText)loaderText.textContent=t};
const withTimeout=async(request,label,ms=12000)=>{let timer;try{return await Promise.race([Promise.resolve(request),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(`${label} is taking too long. Please refresh and try again.`)),ms)})])}finally{clearTimeout(timer)}};
const initials=(a,b)=>`${(a||'')[0]||''}${(b||'')[0]||''}`.toUpperCase();
const gradeFrom=(n,rules)=>{const score=Number(n)||0,hit=(rules||[]).find(x=>score<=Number(x.max)&&score>=Number(x.min));return hit?.grade||'F'};
const pointFrom=(n,rules)=>{const score=Number(n)||0,hit=(rules||[]).find(x=>score<=Number(x.max)&&score>=Number(x.min));return hit?.point??0};

function render(html){const shell=document.querySelector('#app-shell');shell.dataset.content=html;mountShell(user)}
function showError(message){render(`<div class="form-page"><section class="score-card"><span class="hero-kicker">EDIT RESULT</span><h2 style="margin-top:8px">Result could not be loaded</h2><p style="margin:6px 0;color:#667085">${esc(message||'The selected result could not be found.')}</p><div class="form-footer" style="margin-top:18px"><div class="submission-note">Your result was not changed.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="retry-load" type="button">Try Again</button><a class="btn secondary" href="results.html">Back to Enter Results</a></div></div></section></div>`);document.querySelector('#retry-load')?.addEventListener('click',()=>location.reload())}
function studentName(){const s=enrollment?.students||{};return `${s.first_name||''} ${s.middle_name||''} ${s.last_name||''}`.replace(/\s+/g,' ').trim()||'Student'}
function statusClass(status){const s=String(status||'').toUpperCase();return s==='DRAFT'?'draft':s==='SUBMITTED'?'submitted':s==='PUBLISHED'?'published':'none'}
function statusText(status){const s=String(status||'').toUpperCase();return s||'NO RESULT'}
function overviewCard(){const s=enrollment.students||{};return `<section class="student-detail-card"><div class="student-overview"><div class="overview-avatar">${s.photo_url?`<img src="${esc(s.photo_url)}" alt="">`:esc(initials(s.first_name,s.last_name))}</div><div><h2 class="overview-name">${esc(studentName())}</h2><div class="overview-meta"><span class="overview-chip">Current Term: ${esc(term.name)} · ${esc(term.academic_sessions?.name||'Academic Session')}</span><span class="overview-chip">Student ID: ${esc(s.student_id||'—')}</span><span class="overview-chip">Exam No: ${esc(s.exam_number||'—')}</span><span class="overview-chip">Class: ${esc(enrollment.classes?.name||'—')}</span><span class="overview-chip">Level: ${esc(enrollment.classes?.level||'—')}</span></div></div></div><div class="overview-grid"><div class="detail-item"><small>Date of Birth</small><b>${esc(s.date_of_birth||'—')}</b></div><div class="detail-item"><small>Gender</small><b>${esc(s.gender||'—')}</b></div><div class="detail-item"><small>School Email</small><b>${esc(s.school_email||'—')}</b></div><div class="detail-item"><small>Guardian</small><b>${esc(s.guardian_name||'—')}</b></div></div></section>`}
function rowValues(subject){const r=resultMap.get(subject.id);const ca=r?.ca_score??0,exam=r?.exam_score??0,total=r?Number(r.total ?? (Number(ca)+Number(exam))):Number(ca)+Number(exam);return{r,ca,exam,total,grade:r?gradeFrom(total,schoolSettings.grading_rules):'—',point:r?pointFrom(total,schoolSettings.grading_rules):'—'}}
function tableRow(subject){const {r,ca,exam,total,grade,point}=rowValues(subject);const isSelected=selectedSubjectId===subject.id;const teacherOwned=r?.created_by===user.id;const editable=!!r&&teacherOwned&&String(r.status).toUpperCase()!=='PUBLISHED';return `<tr class="${isSelected?'selected-row':''}" data-subject-id="${esc(subject.id)}" data-result-id="${esc(r?.id||'')}"><td><span class="subject-name">${esc(subject.name)}${isSelected?'<span class="selected-tag">Selected</span>':''}</span>${subject.code?`<span class="subject-code">${esc(subject.code)}</span>`:''}${!r?'<span class="result-locked">No result entered yet</span>':''}</td><td>${r?`<input class="result-input ca-input" type="number" min="0" max="${Number(subject.max_ca||40)}" step="0.01" value="${esc(ca)}" ${editable?'':'disabled'} aria-label="${esc(subject.name)} CA score">`: '<span class="result-readonly">—</span>'}<small style="display:block;color:#99a5b6;font-size:9px;margin-top:3px">Max ${esc(subject.max_ca??0)}</small></td><td>${r?`<input class="result-input exam-input" type="number" min="0" max="${Number(subject.max_exam||60)}" step="0.01" value="${esc(exam)}" ${editable?'':'disabled'} aria-label="${esc(subject.name)} exam score">`:'<span class="result-readonly">—</span>'}<small style="display:block;color:#99a5b6;font-size:9px;margin-top:3px">Max ${esc(subject.max_exam??0)}</small></td><td><span class="result-number total-cell">${r?Number(total).toFixed(2).replace(/\.00$/,''):'—'}</span></td><td><span class="result-number grade-cell">${r?esc(grade):'—'}</span></td><td><span class="result-number point-cell">${r?esc(point):'—'}</span></td><td><span class="table-status ${statusClass(r?.status)}">${statusText(r?.status)}</span></td></tr>`}
function renderTable(){const editableRows=subjects.filter(s=>{const r=resultMap.get(s.id);return r&&r.created_by===user.id&&String(r.status).toUpperCase()!=='PUBLISHED'}).length;render(`<div class="form-page"><section class="form-hero"><div><span class="hero-kicker">STUDENT RESULT SHEET</span><h2>Edit Student Result</h2><p>Edit all CA and Exam scores for this student in one place. Totals, grades and grade points recalculate automatically.</p></div><a class="btn secondary" href="results.html?class=${encodeURIComponent(enrollment.class_id)}&subject=${encodeURIComponent(selectedSubjectId||'')}">← Back to Students</a></section>${overviewCard()}<section class="result-sheet-card"><div class="result-sheet-head"><div><h3>Academic Results</h3><p>All assigned subjects are shown below. Editable rows belong to your teacher account and are not yet published by Admin.</p></div><div class="bulk-badge">${editableRows} editable result${editableRows===1?'':'s'}</div></div><div class="result-table-wrap"><table class="result-table"><thead><tr><th>Subject</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th><th>Point</th><th>Status</th></tr></thead><tbody>${subjects.map(tableRow).join('')}</tbody></table></div><div class="save-bar"><div class="save-note">Edit the CA and Exam columns together. <b>Total, Grade and Point are automatic.</b> Published rows remain locked.</div><div class="save-actions">${editableRows?'<button class="btn secondary" id="save-draft" type="button">Save All as Draft</button><button class="btn" id="submit-result" type="button">Submit All to Admin</button>':'<a class="btn" href="results.html">Return to Enter Results</a>'}</div></div><div id="table-message" class="submission-note" style="padding:0 20px 16px"></div></section></div>`);if(editableRows)setupBulkEdit()}
function refreshRow(row){const subject=subjects.find(s=>s.id===row.dataset.subjectId);if(!subject)return;const ca=Number(row.querySelector('.ca-input')?.value||0),exam=Number(row.querySelector('.exam-input')?.value||0),total=ca+exam;row.querySelector('.total-cell').textContent=total.toFixed(2).replace(/\.00$/,'');row.querySelector('.grade-cell').textContent=gradeFrom(total,schoolSettings.grading_rules);row.querySelector('.point-cell').textContent=pointFrom(total,schoolSettings.grading_rules)}
function setupBulkEdit(){document.querySelectorAll('.result-table tbody tr').forEach(row=>{row.querySelector('.ca-input')?.addEventListener('input',()=>refreshRow(row));row.querySelector('.exam-input')?.addEventListener('input',()=>refreshRow(row))});document.querySelector('#save-draft')?.addEventListener('click',()=>saveAll('DRAFT'));document.querySelector('#submit-result')?.addEventListener('click',()=>saveAll('SUBMITTED'))}
function validateRows(){const updates=[];for(const row of document.querySelectorAll('.result-table tbody tr')){const resultId=row.dataset.resultId;if(!resultId)continue;const r=resultMap.get(row.dataset.subjectId);if(!r||r.created_by!==user.id||String(r.status).toUpperCase()==='PUBLISHED')continue;const subject=subjects.find(s=>s.id===row.dataset.subjectId);const ca=Number(row.querySelector('.ca-input')?.value),exam=Number(row.querySelector('.exam-input')?.value);if(!Number.isFinite(ca)||ca<0||ca>Number(subject.max_ca))throw new Error(`${subject.name}: CA must be between 0 and ${subject.max_ca}.`);if(!Number.isFinite(exam)||exam<0||exam>Number(subject.max_exam))throw new Error(`${subject.name}: Exam must be between 0 and ${subject.max_exam}.`);const total=ca+exam;updates.push({id:resultId,ca,exam,total,grade:gradeFrom(total,schoolSettings.grading_rules),grade_point:pointFrom(total,schoolSettings.grading_rules)});}return updates}
async function saveAll(status){const msg=document.querySelector('#table-message'),buttons=[document.querySelector('#save-draft'),document.querySelector('#submit-result')];try{buttons.forEach(b=>{if(b)b.disabled=true});msg.textContent='Saving all result changes…';const updates=validateRows();if(!updates.length)throw new Error('There are no editable results to save.');await Promise.all(updates.map(u=>withTimeout(supabase.from('results').update({ca_score:u.ca,exam_score:u.exam,grade:u.grade,grade_point:u.grade_point,status}).eq('id',u.id).eq('created_by',user.id),'Saving result')));updates.forEach(u=>{const subjectId=subjects.find(s=>resultMap.get(s.id)?.id===u.id)?.id;if(subjectId){const old=resultMap.get(subjectId);resultMap.set(subjectId,{...old,ca_score:u.ca,exam_score:u.exam,grade:u.grade,grade_point:u.grade_point,status})}});toast(status==='SUBMITTED'?'All editable results submitted to admin.':'All editable results saved as drafts.');msg.textContent=status==='SUBMITTED'?'All editable results were submitted to the administrator successfully.':'All editable results were saved as drafts successfully.';if(status==='SUBMITTED')setTimeout(()=>location.href=`results.html?class=${encodeURIComponent(enrollment.class_id)}&subject=${encodeURIComponent(selectedSubjectId||'')}`,900);else renderTable()}catch(e){console.error(e);msg.textContent=e.message||'The results could not be saved.';toast(msg.textContent,'error')}finally{buttons.forEach(b=>{if(b)b.disabled=false})}}

async function load(){if(!resultIdParam&&!studentIdParam)throw new Error('No student or result was selected.');setLoaderText('Checking the current academic term…');const{data:currentTerm,error:termError}=await withTimeout(supabase.from('terms').select('id,name,session_id,academic_sessions(name)').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle(),'Loading the current term');if(termError)throw termError;if(!currentTerm)throw new Error('There is no current academic term configured.');term=currentTerm;
const settingsResponse=await withTimeout(supabase.from('school_settings').select('*').limit(1).maybeSingle(),'Loading grading settings');if(settingsResponse.error)throw settingsResponse.error;schoolSettings=settingsResponse.data||schoolSettings;
let resolvedStudentId=studentIdParam;
if(resultIdParam){setLoaderText('Finding the selected result…');const{data:r,error:re}=await withTimeout(supabase.from('results').select('id,status,ca_score,exam_score,total,grade,grade_point,teacher_remark,principal_remark,published_at,created_at,enrollment_id,term_id,subject_id,created_by').eq('id',resultIdParam).maybeSingle(),'Loading the selected result');if(re)throw re;if(!r)throw new Error('The selected result could not be found.');if(String(r.term_id)!==String(term.id))throw new Error('This result belongs to a different academic term.');selectedSubjectId=r.subject_id;const{data:enr,error:er}=await withTimeout(supabase.from('enrollments').select('id,student_id,class_id,status').eq('id',r.enrollment_id).eq('status','ACTIVE').maybeSingle(),'Loading the student enrollment');if(er)throw er;if(!enr)throw new Error('Active student enrollment not found.');resolvedStudentId=enr.student_id;}
setLoaderText('Loading the student record…');const{data:e,error:ee}=await withTimeout(supabase.from('enrollments').select('id,student_id,class_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url,date_of_birth,gender,school_email,phone,address,guardian_name,guardian_phone),classes(id,name,level,description)').eq('student_id',resolvedStudentId).eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle(),'Loading the student enrollment');if(ee)throw ee;if(!e)throw new Error('Active student enrollment not found.');enrollment=e;if(classIdParam&&String(enrollment.class_id)!==String(classIdParam))throw new Error('The selected class does not match this student enrollment.');
setLoaderText('Loading your assigned subjects…');const{data:assignments,error:ae}=await withTimeout(supabase.from('class_subjects').select('id,class_id,subject_id,teacher_id,subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).eq('class_id',enrollment.class_id).order('id'),'Loading assigned subjects');if(ae)throw ae;subjects=(assignments||[]).filter(x=>x.subjects?.is_active).map(x=>x.subjects);if(!subjects.length)throw new Error('No active subjects are assigned to you for this student’s class.');
if(subjectIdParam&&subjects.some(s=>s.id===subjectIdParam))selectedSubjectId=subjectIdParam;if(!selectedSubjectId)selectedSubjectId=subjects[0].id;
setLoaderText('Loading all student results…');const subjectIds=subjects.map(s=>s.id);const{data:results,error:re}=await withTimeout(supabase.from('results').select('id,enrollment_id,term_id,subject_id,ca_score,exam_score,total,grade,grade_point,teacher_remark,principal_remark,status,created_by,published_at,created_at').eq('enrollment_id',enrollment.id).eq('term_id',term.id).in('subject_id',subjectIds),'Loading student results');if(re)throw re;resultMap=new Map((results||[]).map(r=>[r.subject_id,r]));
if(resultIdParam&&!resultMap.get(selectedSubjectId))throw new Error('The selected result is not available for this teacher’s assigned subject.');renderTable();}

async function run(){try{user=await withTimeout(requireTeacher(),'Verifying teacher access',12000);if(!user)return;if(!user.teacher?.id){const{data:teacher,error}=await withTimeout(supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle(),'Loading teacher profile');if(error)throw error;if(!teacher)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...teacher}}await load()}catch(e){console.error(e);if(user)showError(e.message||'The selected result could not be loaded.');toast(e.message||'Could not load the result.','error')}finally{hideLoader()}}
run();
</script>
</body>
</html>
