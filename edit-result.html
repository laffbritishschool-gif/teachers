<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Update Student Results | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css?v=bulk-edit-20261108"><link rel="stylesheet" href="assets/result-workspace.css?v=bulk-edit-20261108"><link rel="stylesheet" href="assets/portal-loader.css?v=bulk-edit-20261108">
<style>
.bulk-page{display:grid;gap:17px;max-width:1120px;color:#142544}.bulk-hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,#082b63,#0b5ed7);color:#fff}.bulk-hero h2{margin:9px 0 5px;font-size:27px}.bulk-hero p{margin:0;color:#dce8fb;font-size:12px;line-height:1.6}.bulk-student{display:flex;gap:14px;align-items:center;padding:17px;background:#fff;border:1px solid #e3e9f2;border-radius:18px}.bulk-student h3{margin:0 0 7px}.bulk-meta{display:flex;flex-wrap:wrap;gap:7px}.bulk-meta span{padding:5px 8px;background:#f3f6fb;border-radius:99px;color:#667085;font-size:10px}
.bulk-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;background:#fff;border:1px solid #e3e9f2;border-radius:16px}.bulk-info div{padding:10px;background:#f7f9fc;border-radius:11px}.bulk-info small{display:block;color:#8994a5;font-size:9px;font-weight:900;text-transform:uppercase}.bulk-info b{display:block;margin-top:5px;font-size:12px}
.bulk-section{display:grid;gap:12px}.bulk-table-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bulk-table-head h3{margin:0}.bulk-table-head p{margin:5px 0 0;color:#667085;font-size:11px}
.bulk-subjects{display:grid;gap:12px}.entry-row{display:grid;grid-template-columns:minmax(170px,1.2fr) repeat(2,minmax(110px,.7fr)) minmax(150px,1fr) 38px;gap:10px;align-items:end;padding:15px;background:#fff;border:1px solid #e3e9f2;border-radius:15px}.entry-row.is-published{background:#f8fafc;border-color:#e6ebf2}.entry-field{display:grid;gap:6px;color:#667085;font-size:10px;font-weight:800}.entry-field input,.entry-field textarea,.entry-field select{width:100%;box-sizing:border-box;border:1px solid #dce4ef;border-radius:10px;padding:11px;background:#fff;color:#13233f;font:inherit}.entry-field input{height:43px;font-size:14px;font-weight:800}.entry-field textarea{min-height:42px;resize:vertical}.entry-field input:disabled,.entry-field textarea:disabled{background:#f1f4f8;color:#7d8796}.entry-max{font-size:10px;color:#98a2b3;font-weight:500}.entry-remove{width:36px;height:40px;border:0;border-radius:10px;background:#fff0f0;color:#c03939;font-size:19px;cursor:pointer}.entry-remove:disabled{opacity:.3;cursor:not-allowed}.entry-remove.waiting{background:#f3f6fb;color:#7a8798}.entry-total{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:9px;border-top:1px solid #edf1f6;color:#667085;font-size:11px}.entry-total strong{color:#0b5ed7}.entry-status{font-size:9px;font-weight:900;padding:5px 8px;border-radius:99px;background:#fff5da;color:#956800}.entry-status.submitted{background:#edf4ff;color:#315e9d}.entry-status.published{background:#e9f7ef;color:#16733d}
.bulk-existing{padding:13px 15px;background:#f7fafc;border:1px solid #e3e9f2;border-radius:13px;color:#667085;font-size:12px}.bulk-add button{border:1px dashed #0b5ed7;background:#f3f7ff;color:#0b5ed7;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.bulk-add button:disabled{opacity:.45;cursor:not-allowed}.bulk-empty{padding:22px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px;color:#667085;font-size:12px}.bulk-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:#fff;border:1px solid #e3e9f2;border-radius:16px}.bulk-actions{display:flex;gap:8px;flex-wrap:wrap}.bulk-note{font-size:11px;color:#667085;line-height:1.5}.bulk-alert{padding:12px 14px;background:#fff8e8;border:1px solid #f0dfb4;border-radius:12px;color:#795d20;font-size:11px;line-height:1.5}
@media(max-width:760px){.entry-row{grid-template-columns:1fr 1fr}.entry-subject-wrap,.entry-remark{grid-column:1/-1}.entry-remove{grid-column:2;grid-row:1;justify-self:end}.entry-total{grid-column:1/-1}}@media(max-width:560px){.bulk-info{grid-template-columns:1fr 1fr}.bulk-hero h2{font-size:23px}.bulk-student{align-items:flex-start}.entry-row{grid-template-columns:1fr 1fr}.entry-subject-wrap,.entry-remark{grid-column:1/-1}}
</style></head>
<body data-title="Update Results">
<div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Preparing Result Sheet</div><div class="lbs-loader-text">Loading student and term details…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div>
<div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast,getCachedSchoolSettings}from'./assets/app.js';
const esc=escapeHtml,p=new URLSearchParams(location.search),resultId=p.get('resultid')||p.get('result'),studentId=p.get('studentid')||p.get('id'),classId=p.get('classid')||p.get('class'),loader=document.querySelector('#page-loader');
let user,enrollment,subjects=[],records=[],term,settings=getCachedSchoolSettings(),counter=0,saving=false;
const hide=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
const grade=n=>{const r=(settings.grading_rules||[]).find(x=>Number(n)>=Number(x.min)&&Number(n)<=Number(x.max));return r?.grade||'F'};
const point=n=>{const r=(settings.grading_rules||[]).find(x=>Number(n)>=Number(x.min)&&Number(n)<=Number(x.max));return r?.point??0};
const totalText=n=>Number(n||0).toFixed(2).replace(/\.00$/,'');
function render(html){const s=document.querySelector('#app-shell');s.dataset.content=html;mountShell(user)}
function studentInfo(){const s=enrollment.students||{},name=[s.first_name,s.middle_name,s.last_name].filter(Boolean).join(' '),initials=((s.first_name||'')[0]||'')+((s.last_name||'')[0]||'');return '<section class="bulk-student"><div class="detail-avatar">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'" alt="">':esc(initials.toUpperCase()||'ST'))+'</div><div><h3>'+esc(name||'Student')+'</h3><div class="bulk-meta"><span>Student ID: '+esc(s.student_id||'—')+'</span><span>Exam No: '+esc(s.exam_number||'—')+'</span><span>Class: '+esc(enrollment.classes?.name||'—')+'</span><span>Level: '+esc(enrollment.classes?.level||'—')+'</span></div></div></section>'}
function renderPage(){const sessionName=term.academic_sessions?.name||'—';render('<div class="bulk-page"><section class="bulk-hero"><span class="hero-kicker">TEACHER RESULT CORRECTION</span><h2>Update Student Results</h2><p>This works like the Add Results sheet. Edit returned results, add missing subjects, or remove an incorrect result before sending the corrected sheet back to the administrator.</p></section>'+studentInfo()+'<section class="bulk-info"><div><small>Academic session</small><b>'+esc(sessionName)+'</b></div><div><small>Term / examination</small><b>'+esc(term.name||'—')+'</b></div><div><small>Editable results</small><b>'+records.filter(r=>r.status!=='PUBLISHED').length+' of '+records.length+'</b></div></section><div class="bulk-alert">Published results cannot be changed or removed. Only unpublished results for subjects assigned to your class can be edited or removed.</div><section class="bulk-section"><div class="bulk-table-head"><div><h3>Subject Results</h3><p>Edit existing entries or add another subject below.</p></div><a class="btn secondary" href="results.html?class='+encodeURIComponent(enrollment.class_id)+'">← Back to Students</a></div><div id="existing-summary" class="bulk-existing"></div><div id="subject-rows" class="bulk-subjects"></div><div class="bulk-add"><button type="button" id="add-subject">＋ Add another subject</button></div><div class="bulk-footer"><div class="bulk-note">Save as Draft to continue later, or submit all changes to the administrator. New rows are saved only when a subject and both scores are entered.</div><div class="bulk-actions"><button class="btn secondary" id="save-draft" type="button">Save as Draft</button><button class="btn" id="submit-results" type="button">Submit to Admin</button></div></div><div id="bulk-message" class="bulk-note" aria-live="polite"></div></section></div>');drawRows();document.querySelector('#add-subject').onclick=addRow;document.querySelector('#save-draft').onclick=()=>save('DRAFT');document.querySelector('#submit-results').onclick=()=>save('SUBMITTED')}
function usedSubjects(except){return [...document.querySelectorAll('.entry-row')].filter(r=>r!==except).map(r=>r.dataset.subject||r.querySelector('.entry-subject')?.value).filter(Boolean)}
function refreshAddOptions(){const used=usedSubjects();document.querySelectorAll('.entry-row.is-new').forEach(row=>{const sel=row.querySelector('.entry-subject'),current=sel.value;sel.innerHTML='<option value="">Choose a subject</option>'+subjects.filter(s=>!used.includes(s.id)&&!records.some(r=>r.subject_id===s.id)||s.id===current).map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+(s.code?' · '+esc(s.code):'')+'</option>').join('');sel.value=current;const sub=subjects.find(s=>s.id===current);row.querySelector('.entry-ca').max=Number(sub?.max_ca??40);row.querySelector('.entry-exam').max=Number(sub?.max_exam??60);row.querySelector('.entry-ca-max').textContent='Max '+Number(sub?.max_ca??40);row.querySelector('.entry-exam-max').textContent='Max '+Number(sub?.max_exam??60)})}
function addRow(){const used=usedSubjects();const available=subjects.filter(s=>!used.includes(s.id)&&!records.some(r=>r.subject_id===s.id));if(!available.length){toast('There are no additional subjects available for this student in this term.','info');return}const row=document.createElement('article');row.className='entry-row is-new';row.dataset.key='new-'+(++counter);row.innerHTML='<label class="entry-field entry-subject-wrap">Subject<select class="entry-subject"><option value="">Choose a subject</option></select></label><label class="entry-field">CA Score <span class="entry-ca-max"></span><input class="entry-ca" type="number" min="0" step="0.01" placeholder="0"></label><label class="entry-field">Exam Score <span class="entry-exam-max"></span><input class="entry-exam" type="number" min="0" step="0.01" placeholder="0"></label><label class="entry-field entry-remark">Teacher Remark<textarea class="entry-remark-input" maxlength="500" placeholder="Optional teacher remark"></textarea></label><button class="entry-remove" type="button" title="Remove this row" aria-label="Remove this row">×</button><div class="entry-total"><span>Total: <strong class="entry-sum">0</strong></span><span>Grade: <b class="entry-grade">—</b> · Point: <b class="entry-point">—</b></span></div>';document.querySelector('#subject-rows').appendChild(row);row.querySelector('.entry-subject').onchange=()=>{refreshAddOptions();updateRow(row)};row.querySelectorAll('.entry-ca,.entry-exam').forEach(x=>x.oninput=()=>updateRow(row));row.querySelector('.entry-remove').onclick=()=>{row.remove();refreshAddOptions()};refreshAddOptions()}
function drawRows(){const box=document.querySelector('#subject-rows');box.innerHTML='';document.querySelector('#existing-summary').textContent=records.length?records.length+' result row(s) found for this term. Use × to remove an unpublished result.':'No results have been entered for this term yet. Add subjects below.';for(const r of records){const sub=subjects.find(s=>s.id===r.subject_id);if(!sub)continue;const locked=r.status==='PUBLISHED',row=document.createElement('article');row.className='entry-row'+(locked?' is-published':'');row.dataset.resultId=r.id;row.dataset.subject=r.subject_id;row.dataset.status=r.status;row.innerHTML='<label class="entry-field entry-subject-wrap">Subject<div style="display:flex;align-items:center;gap:8px;min-height:42px"><strong style="font-size:12px;color:#1b3152">'+esc(sub.name)+'</strong><span class="entry-status '+(locked?'published':r.status==='SUBMITTED'?'submitted':'')+'">'+(locked?'PUBLISHED':esc(r.status))+'</span></div></label><label class="entry-field">CA Score <span class="entry-ca-max">Max '+Number(sub.max_ca??40)+'</span><input class="entry-ca" type="number" min="0" max="'+Number(sub.max_ca??40)+'" step="0.01" value="'+esc(r.ca_score??0)+'" '+(locked?'disabled':'')+'></label><label class="entry-field">Exam Score <span class="entry-exam-max">Max '+Number(sub.max_exam??60)+'</span><input class="entry-exam" type="number" min="0" max="'+Number(sub.max_exam??60)+'" step="0.01" value="'+esc(r.exam_score??0)+'" '+(locked?'disabled':'')+'></label><label class="entry-field entry-remark">Teacher Remark<textarea class="entry-remark-input" maxlength="500" '+(locked?'disabled':'')+'>'+esc(r.teacher_remark||'')+'</textarea></label><button class="entry-remove '+(locked?'waiting':'')+'" type="button" title="'+(locked?'Published results cannot be removed':'Remove this result')+'" aria-label="Remove this result" '+(locked?'disabled':'')+'>×</button><div class="entry-total"><span>Total: <strong class="entry-sum">'+totalText(r.total??(Number(r.ca_score)+Number(r.exam_score)))+'</strong></span><span>Grade: <b class="entry-grade">'+esc(r.grade||grade(Number(r.ca_score)+Number(r.exam_score)))+'</b> · Point: <b class="entry-point">'+esc(r.grade_point??point(Number(r.ca_score)+Number(r.exam_score)))+'</b></span></div>';box.appendChild(row);row.querySelectorAll('.entry-ca,.entry-exam').forEach(x=>x.oninput=()=>updateRow(row));if(!locked)row.querySelector('.entry-remove').onclick=()=>removeSaved(row,r)}}
function updateRow(row){const ca=Number(row.querySelector('.entry-ca').value||0),exam=Number(row.querySelector('.entry-exam').value||0),n=ca+exam;row.querySelector('.entry-sum').textContent=totalText(n);row.querySelector('.entry-grade').textContent=grade(n);row.querySelector('.entry-point').textContent=point(n)}
async function removeSaved(row,r){if(!confirm('Remove '+(subjects.find(s=>s.id===r.subject_id)?.name||'this subject')+' result from this student and term? This cannot be undone.'))return;const btn=row.querySelector('.entry-remove');btn.disabled=true;try{const{data,error}=await supabase.from('results').delete().eq('id',r.id).select('id').maybeSingle();if(error)throw error;if(!data)throw new Error('The result was not removed. It may be published or you may not be assigned to this subject.');records=records.filter(x=>x.id!==r.id);row.remove();document.querySelector('#existing-summary').textContent=records.length+' result row(s) remain for this term.';refreshAddOptions();toast('Result removed successfully.')}catch(e){console.error(e);toast(e.message||'Could not remove result.','error');btn.disabled=false}}
async function save(status){if(saving)return;saving=true;const buttons=[document.querySelector('#save-draft'),document.querySelector('#submit-results')],msg=document.querySelector('#bulk-message');buttons.forEach(b=>b.disabled=true);try{const updates=[],inserts=[];for(const row of document.querySelectorAll('.entry-row')){if(row.dataset.status==='PUBLISHED')continue;const isNew=row.classList.contains('is-new'),subjectId=isNew?row.querySelector('.entry-subject').value:row.dataset.subject,caText=row.querySelector('.entry-ca').value,examText=row.querySelector('.entry-exam').value;if(isNew&&!subjectId&&!caText&&!examText)continue;if(!subjectId)throw new Error('Choose a subject for each new row that contains scores.');if(caText===''||examText==='')throw new Error('Enter both CA and examination scores for every selected subject.');const sub=subjects.find(s=>s.id===subjectId);if(!sub)throw new Error('The selected subject is not assigned to this class.');const ca=Number(caText),exam=Number(examText),maxCa=Number(sub.max_ca??40),maxExam=Number(sub.max_exam??60);if(!Number.isFinite(ca)||ca<0||ca>maxCa)throw new Error(sub.name+': CA must be between 0 and '+maxCa+'.');if(!Number.isFinite(exam)||exam<0||exam>maxExam)throw new Error(sub.name+': Exam must be between 0 and '+maxExam+'.');const n=ca+exam,payload={ca_score:ca,exam_score:exam,grade:grade(n),grade_point:point(n),teacher_remark:row.querySelector('.entry-remark-input').value.trim()||null,status};if(isNew)inserts.push({...payload,enrollment_id:enrollment.id,term_id:term.id,subject_id:sub.id,created_by:user.id});else updates.push({id:row.dataset.resultId,payload})}const newIds=inserts.map(x=>x.subject_id);if(new Set(newIds).size!==newIds.length)throw new Error('A subject can only be added once.');if(newIds.some(id=>records.some(r=>r.subject_id===id)))throw new Error('A result already exists for one of the selected subjects. Refresh the page and try again.');msg.textContent='Saving result changes…';for(const item of updates){const{data,error}=await supabase.from('results').update(item.payload).eq('id',item.id).select('id').maybeSingle();if(error)throw error;if(!data)throw new Error('One of the existing results could not be updated. Check your subject assignment.')}if(inserts.length){const{error}=await supabase.from('results').insert(inserts);if(error)throw error}toast('Result sheet saved successfully.');msg.textContent=updates.length+' existing result(s) updated and '+inserts.length+' new result(s) added.';setTimeout(()=>location.href='results.html?class='+encodeURIComponent(enrollment.class_id),1100)}catch(e){console.error(e);msg.textContent=e.message||'Could not save these results.';toast(msg.textContent,'error')}finally{saving=false;buttons.forEach(b=>b.disabled=false)}}
async function load(){if(!resultId&&!studentId)throw new Error('No result or student was selected. Open this page from the student results list.');const sr=await supabase.from('school_settings').select('*').limit(1).maybeSingle();if(!sr.error&&sr.data)settings=sr.data;let seed;if(resultId){const{data:r,error}=await supabase.from('results').select('id,enrollment_id,term_id,status').eq('id',resultId).maybeSingle();if(error)throw error;if(!r)throw new Error('The selected result could not be found.');seed=r}else{const{data:r,error}=await supabase.from('results').select('id,enrollment_id,term_id,status').eq('enrollment_id',studentId).limit(1).maybeSingle();if(error)throw error;if(!r)throw new Error('Open a result from the results list so the student and term can be identified.');seed=r}const{data:e,error:ee}=await supabase.from('enrollments').select('id,student_id,class_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url),classes(id,name,level)').eq('id',seed.enrollment_id).maybeSingle();if(ee)throw ee;if(!e)throw new Error('Student enrollment could not be found.');enrollment=e;if(classId&&String(classId)!==String(e.class_id))throw new Error('The selected class does not match this student.');if(studentId&&String(studentId)!==String(e.student_id))throw new Error('The selected student does not match this result.');const{data:assigned,error:ae}=await supabase.from('class_subjects').select('subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).eq('class_id',e.class_id);if(ae)throw ae;subjects=(assigned||[]).map(x=>x.subjects).filter(s=>s?.is_active).filter((s,i,a)=>a.findIndex(x=>x.id===s.id)===i);if(!subjects.length)throw new Error('No active subjects are assigned to you for this class.');const{data:t,error:te}=await supabase.from('terms').select('id,name,session_id,academic_sessions(name)').eq('id',seed.term_id).maybeSingle();if(te)throw te;if(!t)throw new Error('The academic term for this result could not be found.');term=t;const{data:all,error:re}=await supabase.from('results').select('id,enrollment_id,term_id,subject_id,ca_score,exam_score,total,grade,grade_point,teacher_remark,status,created_by').eq('enrollment_id',e.id).eq('term_id',t.id);if(re)throw re;records=(all||[]).filter(r=>subjects.some(s=>s.id===r.subject_id)).map(r=>({...r,status:String(r.status).toUpperCase()}));renderPage()}
async function run(){try{user=await requireTeacher();if(!user)return;const{data:t,error}=await supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...t};await load()}catch(e){console.error(e);if(user)render('<div class="form-page"><section class="score-card"><h2>Result sheet unavailable</h2><p>'+esc(e.message||'Could not load this student result sheet.')+'</p><a class="btn" href="results.html">Back to Results</a></section></div>');toast(e.message||'Could not open the result sheet.','error')}finally{hide()}}
run();
</script></body></html>
