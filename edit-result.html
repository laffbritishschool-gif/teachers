<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Student Result | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/result-workspace.css">
<link rel="stylesheet" href="assets/portal-loader.css">
<style>
.edit-result-page{max-width:1050px;margin:auto;display:grid;gap:18px;color:#142544}
.er-hero{padding:25px 27px;border-radius:22px;background:linear-gradient(125deg,#082b63,#0b5ed7);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.er-kicker{font-size:10px;font-weight:900;letter-spacing:.13em;color:#dbeafe}.er-hero h2{font-size:27px;margin:8px 0 5px}.er-hero p{font-size:12px;color:#dbe8fb;margin:0;max-width:620px;line-height:1.6}
.er-back{color:#fff!important;border:1px solid #ffffff55!important;background:#ffffff12!important;text-decoration:none;white-space:nowrap}
.er-student{display:grid;grid-template-columns:70px 1fr;gap:15px;align-items:center;background:#fff;border:1px solid #e5ebf3;border-radius:18px;padding:17px;box-shadow:0 7px 24px #18365a0a}
.er-avatar{width:70px;height:70px;border-radius:17px;overflow:hidden;background:#edf4ff;color:#1454a4;display:grid;place-items:center;font-size:21px;font-weight:900}.er-avatar img{width:100%;height:100%;object-fit:cover}.er-name{font-size:18px;font-weight:900;margin:0 0 8px}.er-meta{display:flex;gap:7px;flex-wrap:wrap}.er-meta span{font-size:10px;color:#596b84;background:#f3f6fa;border-radius:99px;padding:6px 9px}
.er-card{background:#fff;border:1px solid #e5ebf3;border-radius:19px;overflow:hidden;box-shadow:0 7px 24px #18365a0a}.er-card-head{padding:18px 20px;border-bottom:1px solid #edf1f6;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.er-card-head h3{font-size:15px;margin:0;color:#142544}.er-card-head p{font-size:11px;color:#7b8798;margin:5px 0 0}.er-status{font-size:10px;font-weight:900;border-radius:99px;padding:7px 10px;background:#fff6dc;color:#946300}.er-status.submitted{background:#eef4ff;color:#315e9d}.er-status.published{background:#e9f7ef;color:#16733d}
.er-form{padding:20px;display:grid;gap:17px}.er-context{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.er-context div{padding:12px;background:#f7f9fc;border:1px solid #edf1f6;border-radius:12px}.er-context small{display:block;font-size:9px;font-weight:900;color:#8592a5;text-transform:uppercase;letter-spacing:.06em}.er-context b{display:block;margin-top:5px;font-size:12px;color:#243753}
.er-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.er-field{display:grid;gap:7px}.er-field label{font-size:11px;font-weight:900;color:#53637a}.er-field input,.er-field textarea{width:100%;box-sizing:border-box;border:1px solid #dce4ef;border-radius:11px;background:#fff;padding:12px 13px;color:#142544;font:inherit;outline:none}.er-field input{height:47px;font-size:16px;font-weight:800}.er-field textarea{min-height:92px;resize:vertical}.er-field input:focus,.er-field textarea:focus{border-color:#0b5ed7;box-shadow:0 0 0 3px #0b5ed71a}.er-field input:disabled,.er-field textarea:disabled{background:#f5f7fa;color:#8793a5;cursor:not-allowed}.er-help{font-size:10px;color:#97a2b1}.er-preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.er-preview div{background:#f5f8fd;border:1px solid #edf1f6;border-radius:13px;padding:13px;text-align:center}.er-preview b{display:block;font-size:21px;color:#0b4c9d}.er-preview small{display:block;font-size:9px;color:#75839a;margin-top:4px;text-transform:uppercase;font-weight:900;letter-spacing:.05em}
.er-footer{padding:16px 20px;border-top:1px solid #edf1f6;background:#fbfcfe;display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap}.er-note{font-size:11px;color:#718096;line-height:1.5;max-width:520px}.er-actions{display:flex;gap:9px;flex-wrap:wrap}.er-actions button{min-width:145px}.er-message{padding:0 20px 17px;font-size:11px;color:#53637a;min-height:16px}.er-lock{padding:16px;background:#fff8e6;border:1px solid #f2dfac;color:#805d13;border-radius:13px;font-size:12px;line-height:1.6}
@media(max-width:680px){.er-hero h2{font-size:23px}.er-context{grid-template-columns:1fr 1fr}.er-fields{grid-template-columns:1fr}.er-preview{grid-template-columns:1fr 1fr}.er-student{grid-template-columns:55px 1fr}.er-avatar{width:55px;height:55px;border-radius:14px}.er-footer{align-items:stretch}.er-actions{width:100%}.er-actions button{flex:1;min-width:0}}
</style>
</head>
<body data-title="Edit Result">
<div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Opening Result Editor</div><div class="lbs-loader-text">Verifying your teacher access…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div>
<div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import {requireTeacher,mountShell,supabase,escapeHtml,toast,getCachedSchoolSettings} from './assets/app.js';
const esc=escapeHtml,params=new URLSearchParams(location.search),resultId=params.get('resultid')||params.get('result'),studentId=params.get('studentid')||params.get('id'),classId=params.get('classid')||params.get('class'),subjectId=params.get('subjectid')||params.get('subject');
const loader=document.querySelector('#page-loader');let user,record,enrollment,subject,term,settings=getCachedSchoolSettings(),canEdit=false;
const hideLoader=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
const initials=(s)=>[s?.first_name,s?.last_name].filter(Boolean).map(x=>x[0]).join('').toUpperCase()||'ST';
const number=(v)=>Number.isFinite(Number(v))?Number(v):0;
const grade=(score)=>{const rules=settings.grading_rules||[];return rules.find(x=>score>=Number(x.min)&&score<=Number(x.max))?.grade||'F'};
const point=(score)=>{const rules=settings.grading_rules||[];return rules.find(x=>score>=Number(x.min)&&score<=Number(x.max))?.point??0};
function render(html){const shell=document.querySelector('#app-shell');shell.dataset.content=html;mountShell(user)}
function statusLabel(s){const v=String(s||'DRAFT').toUpperCase();return v==='PUBLISHED'?'Published':v==='SUBMITTED'?'Submitted to admin':'Draft / Returned'}
function studentCard(){const s=enrollment.students||{};return '<section class="er-student"><div class="er-avatar">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'" alt="">':esc(initials(s)))+'</div><div><h3 class="er-name">'+esc([s.first_name,s.middle_name,s.last_name].filter(Boolean).join(' ')||'Student')+'</h3><div class="er-meta"><span>Student ID: '+esc(s.student_id||'—')+'</span><span>Exam No: '+esc(s.exam_number||'—')+'</span><span>Class: '+esc(enrollment.classes?.name||'—')+'</span><span>Level: '+esc(enrollment.classes?.level||'—')+'</span></div></div></section>'}
function draw(){const s=enrollment.students||{},published=String(record.status).toUpperCase()==='PUBLISHED';const ca=number(record.ca_score),exam=number(record.exam_score),total=ca+exam;render('<div class="edit-result-page"><section class="er-hero"><div><span class="er-kicker">ACADEMIC RECORD · RESULT CORRECTION</span><h2>Edit Student Result</h2><p>Update the scores and teacher remark for this subject. Changes are saved directly to the selected student, subject and term.</p></div><a class="btn er-back" href="results.html?class='+encodeURIComponent(enrollment.class_id)+'">← Back to results</a></section>'+studentCard()+'<section class="er-card"><div class="er-card-head"><div><h3>'+esc(subject.name)+' · Result details</h3><p>Check the session and term before saving your corrections.</p></div><span class="er-status '+(published?'published':String(record.status).toLowerCase()==='submitted'?'submitted':'')+'">'+esc(statusLabel(record.status))+'</span></div><div class="er-form"><div class="er-context"><div><small>Academic session</small><b>'+esc(term.academic_sessions?.name||'—')+'</b></div><div><small>Term / examination</small><b>'+esc(term.name||'—')+'</b></div><div><small>Subject</small><b>'+esc(subject.name)+'</b></div></div>'+(published?'<div class="er-lock">This result has already been published and is locked against further changes. Please contact the administrator if a correction is required.</div>':'<div class="er-fields"><div class="er-field"><label for="ca-score">Continuous Assessment (CA)</label><input id="ca-score" type="number" min="0" max="'+number(subject.max_ca)+'" step="0.01" value="'+esc(record.ca_score??0)+'"><span class="er-help">Maximum score: '+number(subject.max_ca)+'</span></div><div class="er-field"><label for="exam-score">Examination score</label><input id="exam-score" type="number" min="0" max="'+number(subject.max_exam)+'" step="0.01" value="'+esc(record.exam_score??0)+'"><span class="er-help">Maximum score: '+number(subject.max_exam)+'</span></div><div class="er-field" style="grid-column:1/-1"><label for="teacher-remark">Teacher remark</label><textarea id="teacher-remark" maxlength="500" placeholder="Write a short comment about the student’s performance…">'+esc(record.teacher_remark||'')+'</textarea><span class="er-help">Optional · up to 500 characters</span></div></div>')+'<div class="er-preview"><div><b id="preview-total">'+total.toFixed(2).replace(/\.00$/,'')+'</b><small>Total score</small></div><div><b id="preview-grade">'+esc(grade(total))+'</b><small>Grade</small></div><div><b id="preview-point">'+esc(point(total))+'</b><small>Grade point</small></div><div><b>'+esc(subject.max_ca!==undefined?number(subject.max_ca)+number(subject.max_exam):100)+'</b><small>Maximum total</small></div></div></div>'+(published?'':'<div class="er-footer"><div class="er-note">You can save corrections as a draft or submit the corrected result to the administrator. Published results remain protected.</div><div class="er-actions"><button class="btn secondary" id="save-draft" type="button">Save as Draft</button><button class="btn" id="submit-result" type="button">Submit to Admin</button></div></div><div id="er-message" class="er-message" aria-live="polite"></div>')+'</section></div>');if(!published)bindEditor()}
function updatePreview(){const ca=number(document.querySelector('#ca-score')?.value),exam=number(document.querySelector('#exam-score')?.value),total=ca+exam;document.querySelector('#preview-total').textContent=total.toFixed(2).replace(/\.00$/,'');document.querySelector('#preview-grade').textContent=grade(total);document.querySelector('#preview-point').textContent=point(total)}
function bindEditor(){['#ca-score','#exam-score'].forEach(sel=>document.querySelector(sel)?.addEventListener('input',updatePreview));document.querySelector('#save-draft')?.addEventListener('click',()=>save('DRAFT'));document.querySelector('#submit-result')?.addEventListener('click',()=>save('SUBMITTED'))}
async function save(status){const draftBtn=document.querySelector('#save-draft'),submitBtn=document.querySelector('#submit-result'),msg=document.querySelector('#er-message');[draftBtn,submitBtn].forEach(b=>{if(b)b.disabled=true});try{const caText=document.querySelector('#ca-score').value,examText=document.querySelector('#exam-score').value,ca=Number(caText),exam=Number(examText),maxCa=number(subject.max_ca),maxExam=number(subject.max_exam);if(caText===''||!Number.isFinite(ca)||ca<0||ca>maxCa)throw new Error('CA score must be between 0 and '+maxCa+'.');if(examText===''||!Number.isFinite(exam)||exam<0||exam>maxExam)throw new Error('Exam score must be between 0 and '+maxExam+'.');const total=ca+exam,payload={ca_score:ca,exam_score:exam,grade:grade(total),grade_point:point(total),teacher_remark:document.querySelector('#teacher-remark').value.trim()||null,status};msg.textContent='Saving your changes…';const{data,error}=await supabase.from('results').update(payload).eq('id',record.id).select('id,status,ca_score,exam_score,teacher_remark').maybeSingle();if(error)throw error;if(!data)throw new Error('No result was updated. Check that you are assigned to this class and subject, then refresh the page.');record={...record,...data,...payload};toast(status==='SUBMITTED'?'Corrected result submitted to the administrator.':'Result corrections saved as draft.');msg.textContent=status==='SUBMITTED'?'Your corrected result has been submitted to the administrator.':'Your changes have been saved successfully.';const badge=document.querySelector('.er-status');if(badge){badge.textContent=statusLabel(status);badge.className='er-status '+(status==='SUBMITTED'?'submitted':'')} }catch(e){console.error(e);msg.textContent=e.message||'Could not save this result.';toast(msg.textContent,'error')}finally{[draftBtn,submitBtn].forEach(b=>{if(b)b.disabled=false})}}
async function load(){if(!resultId)throw new Error('The result ID is missing. Open Edit Result from the student results list.');const settingsResponse=await supabase.from('school_settings').select('*').limit(1).maybeSingle();if(!settingsResponse.error&&settingsResponse.data)settings=settingsResponse.data;const{data:r,error:re}=await supabase.from('results').select('id,enrollment_id,term_id,subject_id,ca_score,exam_score,total,grade,grade_point,teacher_remark,status,created_by').eq('id',resultId).maybeSingle();if(re)throw re;if(!r)throw new Error('The selected result could not be found or you do not have access to it.');record=r;if(String(r.status).toUpperCase()==='PUBLISHED')canEdit=false;const{data:e,error:ee}=await supabase.from('enrollments').select('id,student_id,class_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url),classes(id,name,level)').eq('id',r.enrollment_id).maybeSingle();if(ee)throw ee;if(!e)throw new Error('Student enrollment could not be found.');enrollment=e;if(classId&&String(classId)!==String(e.class_id))throw new Error('The class in this link does not match the selected result.');if(studentId&&String(studentId)!==String(e.student_id))throw new Error('The student in this link does not match the selected result.');if(subjectId&&String(subjectId)!==String(r.subject_id))throw new Error('The subject in this link does not match the selected result.');const{data:a,error:ae}=await supabase.from('class_subjects').select('id,teacher_id,subjects(id,name,code,max_ca,max_exam,is_active)').eq('class_id',e.class_id).eq('subject_id',r.subject_id).eq('teacher_id',user.teacher.id).maybeSingle();if(ae)throw ae;if(!a?.subjects)throw new Error('This subject is not assigned to your teacher account for this class. Contact the school administrator to check your class-subject assignment.');subject=a.subjects;if(!subject.is_active)throw new Error('This subject is inactive. Contact the administrator.');const{data:t,error:te}=await supabase.from('terms').select('id,name,session_id,academic_sessions(name)').eq('id',r.term_id).maybeSingle();if(te)throw te;if(!t)throw new Error('The academic term for this result could not be found.');term=t;canEdit=String(r.status).toUpperCase()!=='PUBLISHED';draw()}
async function run(){try{user=await requireTeacher();if(!user)return;if(!user.teacher?.id){const{data:t,error}=await supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...t}}await load()}catch(e){console.error(e);if(user)render('<div class="form-page"><section class="score-card"><h2>Result editor unavailable</h2><p>'+esc(e.message||'Could not load the selected result.')+'</p><a class="btn" href="results.html">Back to results</a></section></div>');toast(e.message||'Could not open the result editor.','error')}finally{hideLoader()}}
run();
</script>
</body>
</html>
