<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/result-workspace.css">
<link rel="stylesheet" href="assets/portal-loader.css">
<style>
.att-card{background:#fff;border:1px solid #e6ebf2;border-radius:20px;box-shadow:0 14px 36px rgba(20,43,78,.07);overflow:hidden;margin-top:16px}.att-toolbar{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:10px;padding:16px 20px;border-bottom:1px solid #edf1f6;background:#fbfcfe;align-items:end}.att-field label{display:block;color:#748197;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}.att-field select,.att-field input{width:100%;height:40px;border:1px solid #dbe3ed;border-radius:10px;padding:0 11px;background:#fff;color:#243650}.att-bulk{display:flex;gap:7px;flex-wrap:wrap}.att-table-wrap{overflow:auto}.att-table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}.att-table th{background:#f7f9fc;color:#687386;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;padding:12px 10px;border-bottom:1px solid #e9eef5;text-align:left;white-space:nowrap}.att-table td{padding:10px;border-bottom:1px solid #eef2f6;font-size:12px;color:#26354d;vertical-align:middle}.att-table tr:last-child td{border-bottom:0}.student-cell{display:flex;align-items:center;gap:10px}.student-avatar{width:36px;height:36px;border-radius:11px;overflow:hidden;display:grid;place-items:center;background:#edf3fb;color:#31527e;font-size:11px;font-weight:900;flex:none}.student-avatar img{width:100%;height:100%;object-fit:cover}.student-name{font-weight:800;color:#13233f}.student-meta{display:block;margin-top:2px;color:#95a0b1;font-size:9px}.att-select{height:34px;border:1px solid #d7e0eb;border-radius:9px;background:#fff;padding:0 9px;font-weight:800;color:#243650;min-width:118px}.att-select.present{border-color:#a7d5bd;background:#f2fbf5;color:#146b44}.att-select.absent{border-color:#efb1b1;background:#fff5f5;color:#aa3333}.att-select.late{border-color:#e5ca8e;background:#fffaf0;color:#946400}.att-select.excused{border-color:#b8cce9;background:#f4f8ff;color:#315f9d}.att-note{width:180px;height:34px;border:1px solid #d7e0eb;border-radius:9px;padding:0 9px;color:#243650}.att-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:16px 20px}.att-stat{padding:12px 14px;border:1px solid #edf1f6;border-radius:14px;background:#f8fafc}.att-stat b{display:block;font-size:18px;color:#13233f}.att-stat span{display:block;margin-top:3px;color:#8490a2;font-size:10px}.att-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-top:1px solid #edf1f6;background:#fbfcfe}.att-note-text{color:#718096;font-size:10px;line-height:1.5}.att-actions{display:flex;gap:8px;flex-wrap:wrap}.att-empty{padding:28px 20px;text-align:center;color:#8b97a8;font-size:11px}.att-history{margin-top:16px;padding:0 20px 20px}.att-history h3{margin:0 0 9px;color:#13233f;font-size:14px}.history-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.history-item{padding:11px 12px;border:1px solid #edf1f6;border-radius:13px;background:#fff}.history-item strong{display:block;color:#243650;font-size:11px}.history-item span{display:block;margin-top:4px;color:#8a96a7;font-size:9px}@media(max-width:1050px){.att-toolbar{grid-template-columns:1fr 1fr}.att-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.history-list{grid-template-columns:1fr 1fr}}@media(max-width:650px){.att-toolbar,.att-summary{grid-template-columns:1fr}.history-list{grid-template-columns:1fr}}
</style>
</head>
<body data-title="Attendance">
<div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Opening Attendance</div><div id="loader-text" class="lbs-loader-text">Preparing your attendance register…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div>
<div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast}from'./assets/app.js';
const esc=escapeHtml,loader=document.querySelector('#page-loader'),loaderText=document.querySelector('#loader-text');let user,classes=[],students=[],selectedClassId='',selectedDate='',attendanceMap=new Map();
const hide=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};const setText=t=>{if(loaderText)loaderText.textContent=t};const timeout=async(request,label,ms=12000)=>{let timer;try{return await Promise.race([Promise.resolve(request),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(`${label} is taking too long. Please try again.`)),ms)})])}finally{clearTimeout(timer)}};const initials=(a,b)=>`${(a||'')[0]||''}${(b||'')[0]||''}`.toUpperCase();const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function renderShell(){mountShell(user);const p=document.querySelector('#app-shell .page-content');p.innerHTML=`<div class="form-page"><section class="form-hero"><div><span class="hero-kicker">DAILY REGISTER</span><h2>Attendance</h2><p>Mark and review attendance for your assigned classes. Each student can have one attendance record per day.</p></div></section><section class="att-card"><div class="att-toolbar"><div class="att-field"><label for="att-class">Class</label><select id="att-class"></select></div><div class="att-field"><label for="att-date">Attendance Date</label><input id="att-date" type="date" value="${selectedDate}"></div><div class="att-field"><label for="att-search">Search Student</label><input id="att-search" type="search" placeholder="Search by student name or ID"></div><div class="att-bulk"><button class="btn secondary" id="present-all" type="button">Present All</button><button class="btn secondary" id="absent-all" type="button">Absent All</button></div></div><div class="att-summary"><div class="att-stat"><b id="count-total">0</b><span>Students</span></div><div class="att-stat"><b id="count-present">0</b><span>Present</span></div><div class="att-stat"><b id="count-absent">0</b><span>Absent</span></div><div class="att-stat"><b id="count-late">0</b><span>Late</span></div><div class="att-stat"><b id="count-excused">0</b><span>Excused</span></div></div><div class="att-table-wrap"><table class="att-table"><thead><tr><th>Student</th><th>Status</th><th>Note</th></tr></thead><tbody id="att-body"><tr><td colspan="3"><div class="att-empty">Loading students…</div></td></tr></tbody></table></div><div class="att-footer"><div class="att-note-text">Attendance is saved under the selected date. You can change statuses and notes, then save the whole class at once.</div><div class="att-actions"><button class="btn" id="save-attendance" type="button">Save Attendance</button><button class="btn secondary" id="refresh-attendance" type="button">↻ Refresh</button></div></div><div id="att-message" class="submission-note" style="padding:0 20px 16px"></div><div class="att-history"><h3>Recent attendance dates</h3><div id="history-list" class="history-list"><div class="history-item"><strong>Loading…</strong><span>Please wait</span></div></div></div></section></div>`;
const cls=document.querySelector('#att-class');cls.innerHTML=classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.level?` · ${esc(c.level)}`:''}</option>`).join('');cls.value=selectedClassId||classes[0]?.id||'';selectedClassId=cls.value;cls.onchange=()=>{selectedClassId=cls.value;loadRegister()};document.querySelector('#att-date').onchange=e=>{selectedDate=e.target.value;loadRegister()};document.querySelector('#att-search').oninput=drawRows;document.querySelector('#present-all').onclick=()=>setAll('PRESENT');document.querySelector('#absent-all').onclick=()=>setAll('ABSENT');document.querySelector('#save-attendance').onclick=saveAttendance;document.querySelector('#refresh-attendance').onclick=loadRegister;}
function statusOptions(value){return ['PRESENT','ABSENT','LATE','EXCUSED'].map(s=>`<option value="${s}" ${value===s?'selected':''}>${s[0]+s.slice(1).toLowerCase()}</option>`).join('')}
function currentRows(){const q=(document.querySelector('#att-search')?.value||'').trim().toLowerCase();return students.filter(s=>{const st=s.students||{};return !q||`${st.first_name||''} ${st.middle_name||''} ${st.last_name||''} ${st.student_id||''} ${st.exam_number||''}`.toLowerCase().includes(q)})}
function drawRows(){const body=document.querySelector('#att-body');if(!body)return;const rows=currentRows();body.innerHTML=rows.length?rows.map(e=>{const s=e.students||{},a=attendanceMap.get(e.id)||{status:'PRESENT',note:''};return `<tr data-enrollment-id="${esc(e.id)}"><td><div class="student-cell"><div class="student-avatar">${s.photo_url?`<img src="${esc(s.photo_url)}" alt="">`:esc(initials(s.first_name,s.last_name))}</div><div><div class="student-name">${esc(`${s.first_name||''} ${s.middle_name||''} ${s.last_name||''}`.replace(/\s+/g,' ').trim()||'Unnamed student')}</div><span class="student-meta">${esc(s.student_id||'No student ID')}${s.exam_number?` · Exam ${esc(s.exam_number)}`:''}</span></div></div></td><td><select class="att-select ${a.status.toLowerCase()}">${statusOptions(a.status)}</select></td><td><input class="att-note" maxlength="250" value="${esc(a.note||'')}" placeholder="Optional note"></td></tr>`}).join(''):'<tr><td colspan="3"><div class="att-empty">No students match your search.</div></td></tr>';body.querySelectorAll('.att-select').forEach(s=>s.onchange=()=>{s.className=`att-select ${s.value.toLowerCase()}`;updateSummary()});updateSummary()}
function updateSummary(){const vals=[...document.querySelectorAll('#att-body tr[data-enrollment-id]')].map(r=>r.querySelector('.att-select')?.value).filter(Boolean);for(const s of ['PRESENT','ABSENT','LATE','EXCUSED'])document.querySelector(`#count-${s.toLowerCase()}`).textContent=vals.filter(v=>v===s).length;document.querySelector('#count-total').textContent=students.length}
function setAll(status){students.forEach(e=>{let a=attendanceMap.get(e.id)||{status:'PRESENT',note:''};attendanceMap.set(e.id,{...a,status})});drawRows()}
async function loadRegister(){selectedDate=document.querySelector('#att-date')?.value||selectedDate||localDate();setText('Loading the class register…');const classId=document.querySelector('#att-class')?.value||selectedClassId;selectedClassId=classId;const{data:en,error:ee}=await timeout(supabase.from('enrollments').select('id,student_id,status,created_at,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url),classes(id,name,level)').eq('class_id',classId).eq('status','ACTIVE').order('created_at'),'Loading students');if(ee)throw ee;students=en||[];setText('Loading attendance for the selected date…');const ids=students.map(e=>e.id);attendanceMap=new Map();if(ids.length){const{data:records,error:ae}=await timeout(supabase.from('attendance').select('id,enrollment_id,attendance_date,status,note,recorded_by').eq('attendance_date',selectedDate).in('enrollment_id',ids),'Loading attendance records');if(ae)throw ae;(records||[]).forEach(r=>attendanceMap.set(r.enrollment_id,r))}drawRows();await loadHistory()}
async function loadHistory(){const classId=selectedClassId;if(!classId)return;const ids=students.map(e=>e.id);const box=document.querySelector('#history-list');if(!box||!ids.length){if(box)box.innerHTML='<div class="history-item"><strong>No attendance history</strong><span>No records yet</span></div>';return}const{data:records,error}=await timeout(supabase.from('attendance').select('attendance_date,status').in('enrollment_id',ids).order('attendance_date',{ascending:false}).limit(100),'Loading attendance history');if(error)throw error;const by=new Map();(records||[]).forEach(r=>{const x=by.get(r.attendance_date)||{present:0,absent:0,late:0,excused:0};x[r.status.toLowerCase()]++;by.set(r.attendance_date,x)});const dates=[...by.entries()].slice(0,6);box.innerHTML=dates.length?dates.map(([d,x])=>`<div class="history-item"><strong>${esc(d)}</strong><span>P ${x.present} · A ${x.absent} · L ${x.late} · E ${x.excused}</span></div>`).join(''):'<div class="history-item"><strong>No attendance history</strong><span>Saved attendance will appear here.</span></div>'}
async function saveAttendance(){const msg=document.querySelector('#att-message'),buttons=[document.querySelector('#save-attendance'),document.querySelector('#refresh-attendance')];try{buttons.forEach(b=>b.disabled=true);const rows=[...document.querySelectorAll('#att-body tr[data-enrollment-id]')];if(!rows.length)throw new Error('There are no students to save.');const payload=rows.map(row=>{const enrollmentId=row.dataset.enrollmentId,status=row.querySelector('.att-select').value,note=row.querySelector('.att-note').value.trim()||null;return{enrollment_id:enrollmentId,attendance_date:selectedDate,status,note,recorded_by:user.id}});msg.textContent='Saving attendance…';const{error}=await timeout(supabase.from('attendance').upsert(payload,{onConflict:'enrollment_id,attendance_date'}),'Saving attendance');if(error)throw error;payload.forEach(r=>attendanceMap.set(r.enrollment_id,r));toast('Attendance saved successfully.');msg.textContent=`Attendance for ${selectedDate} was saved successfully.`;await loadHistory()}catch(e){console.error(e);msg.textContent=e.message||'Attendance could not be saved.';toast(msg.textContent,'error')}finally{buttons.forEach(b=>b.disabled=false)}}
async function load(){selectedDate=localDate();setText('Verifying your teacher profile…');const{data:teacher,error:te}=await timeout(supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle(),'Verifying teacher profile');if(te)throw te;if(!teacher)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...teacher};setText('Loading your assigned classes…');const{data:cs,error:ce}=await timeout(supabase.from('class_subjects').select('class_id,classes(id,name,level)').eq('teacher_id',teacher.id).order('class_id'),'Loading assigned classes');if(ce)throw ce;classes=[...new Map((cs||[]).filter(x=>x.classes).map(x=>[x.class_id,x.classes])).values()];if(!classes.length)throw new Error('No classes are currently assigned to you.');renderShell();await loadRegister()}
try{user=await requireTeacher();if(user)await load()}catch(e){console.error(e);if(user){mountShell(user);document.querySelector('#app-shell .page-content').innerHTML=`<div class="form-page"><section class="score-card"><span class="hero-kicker">ATTENDANCE</span><h2>Attendance could not be loaded</h2><p style="color:#667085">${esc(e.message||'Please try again.')}</p><a class="btn" href="attendance.html">Try Again</a></section></div>`}toast(e.message||'Could not load attendance.','error')}finally{hide()}
</script>
</body>
</html>
