<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Login | Laff British Montessori School</title>
<meta name="description" content="Laff British Montessori School teacher portal login.">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School">
    <p class="eyebrow">LBS TEACHER ACCESS</p>
    <h1>Teacher Portal</h1>
    <p class="muted" id="intro">Enter the school email and Staff ID issued to you.</p>

    <form id="loginForm">
      <label for="email">School Email
        <input id="email" type="email" required autocomplete="email" placeholder="teacher@laffbritishmontesorrischool.com">
      </label>

      <label for="schoolId">Staff ID
        <input id="schoolId" required autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. TCH-123456">
      </label>

      <section id="accountFound" class="hidden">
        <div class="account-box">
          <span class="account-check">✓</span>
          <div>
            <strong id="accountName">Teacher account found</strong>
            <p id="accountText">Your teacher account is ready.</p>
          </div>
        </div>
        <label for="secondaryDisplay">Registered secondary email
          <input id="secondaryDisplay" type="text" readonly>
        </label>
      </section>

      <button class="btn full" id="loginBtn" type="submit">Sign in</button>
      <p id="formError" class="form-error"></p>
    </form>
  </div>
</div>
<div id="toast-host"></div>

<script type="module">
import{setLoading,supabase,toast}from'./assets/app.js';

const $=id=>document.getElementById(id);
const form=$('loginForm'),email=$('email'),schoolId=$('schoolId'),loginBtn=$('loginBtn');
const accountFound=$('accountFound'),accountName=$('accountName'),accountText=$('accountText'),secondaryDisplay=$('secondaryDisplay'),errorBox=$('formError');
const show=e=>e.classList.remove('hidden');
const hide=e=>e.classList.add('hidden');

async function loginCheck(){
  const {data,error}=await supabase.functions.invoke('teacher-login',{
    body:{
      email:email.value.trim().toLowerCase(),
      school_id:schoolId.value.trim().toUpperCase()
    }
  });
  if(error&&data?.error)throw new Error(data.error);
  if(error)throw new Error(error.message||'Teacher login service is unavailable.');
  if(!data?.ok)throw new Error(data?.error||'The School Email and Staff ID could not be verified.');
  return data;
}

async function finish(authEmail,password){
  const {error}=await supabase.auth.signInWithPassword({email:authEmail,password});
  if(error)throw new Error('Your teacher account was found, but portal sign-in could not be completed. Please contact the school administrator.');
  toast('Sign-in successful. Opening your teacher dashboard…');
  location.replace('index.html?signin=returning');
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  errorBox.textContent='';
  hide(accountFound);
  secondaryDisplay.value='';
  setLoading(loginBtn,true,'Checking account…');
  try{
    const result=await loginCheck();
    accountName.textContent=result.full_name||'Teacher account found';
    accountText.textContent='Your registered account was found. Opening the teacher portal…';
    secondaryDisplay.value=result.secondary_email||result.auth_email||'Registered school account';
    show(accountFound);
    await finish(result.auth_email||result.secondary_email||result.school_email||email.value.trim().toLowerCase(),schoolId.value.trim().toUpperCase());
  }catch(err){
    errorBox.textContent=err.message||'Could not sign you in.';
    toast(errorBox.textContent,'error');
  }finally{
    setLoading(loginBtn,false);
  }
});
</script>

<style>
.login-page{min-height:100vh;background:radial-gradient(circle at 20% 20%,#eaf1ff,transparent 35%),#f6f8fc;display:grid;place-items:center}
.login-wrap{width:min(470px,92%)}
.login-card{background:#fff;border:1px solid #e6eaf0;border-radius:24px;padding:36px;box-shadow:0 25px 70px rgba(18,61,143,.12);animation:rise .5s ease}
.login-logo{width:78px;height:78px;border-radius:50%;display:block;margin:0 auto 18px}
.login-card .eyebrow{text-align:center}
.login-card h1{text-align:center;margin:6px 0;font-size:27px}
.muted{text-align:center;color:#667085;font-size:13px;margin-bottom:28px}
label{display:block;font-size:12px;font-weight:700;margin:16px 0}
input{width:100%;margin-top:7px;padding:13px;border:1px solid #dfe4ec;border-radius:10px;font:inherit;outline:none}
input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px #0a66c21a}
.full{width:100%;margin-top:10px}
.form-error{color:#c62828;font-size:12px;min-height:17px;margin-top:12px}
.hidden{display:none}
.account-box{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #dbe7f8;background:#f6f9ff;border-radius:14px;margin:12px 0 18px}
.account-check{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e9f8ef;color:#16834b;font-weight:800;flex:0 0 34px}
.account-box strong{display:block;font-size:11px}
.account-box p{margin:4px 0 0;color:#667085;font-size:10px;line-height:1.5}
.btn:disabled{opacity:.65;cursor:not-allowed}
</style>
</body>
</html>
