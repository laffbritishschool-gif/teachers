<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login | Laff British Montessori School</title><meta name="description" content="Secure Laff British Montessori School teacher portal access using your school email and staff ID."><link rel="stylesheet" href="assets/styles.css"></head><body class="login-page"><div class="login-wrap"><div class="login-card"><img class="login-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><p class="eyebrow">LBS TEACHER ACCESS</p><h1>Teacher Portal</h1><p class="muted" id="intro">Enter the school email and staff ID issued to you.</p><form id="loginForm"><section id="identityStep"><label for="email">School Email<input id="email" type="email" required autocomplete="email" placeholder="teacher@laffbritishmontesorrischool.com"></label><label for="schoolId">Staff ID<input id="schoolId" required autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. TCH-123456"></label><button class="btn full" id="continueBtn" type="submit">Continue</button></section><section id="otpStep" class="hidden"><div class="verify-box"><div class="verify-icon">✉</div><div><strong>Verification required</strong><p id="verifyText">Your registered email has not been confirmed yet. We sent a 6-digit OTP to your primary email address.</p></div></div><label for="otp">Verification code<input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label><div class="otp-actions"><button class="btn full" id="verifyBtn" type="button">Verify &amp; sign in</button><button class="text-btn" id="resendBtn" type="button">Resend code</button></div></section><section id="knownAccount" class="hidden"><div class="account-box"><span class="account-check">✓</span><div><strong id="accountName">Teacher account found</strong><p id="accountText"></p></div></div><label for="secondaryDisplay">Secondary email<input id="secondaryDisplay" type="text" readonly></label><button class="btn full" id="loginKnownBtn" type="button">Sign in</button></section><p id="formError" class="form-error"></p></form><button id="backBtn" class="back-btn hidden" type="button">← Use different details</button></div></div><div id="toast-host"></div><script type="module">import{setLoading,supabase,toast}from'./assets/app.js';
const $=id=>document.getElementById(id),form=$('loginForm'),identity=$('identityStep'),otpStep=$('otpStep'),known=$('knownAccount'),email=$('email'),schoolId=$('schoolId'),otp=$('otp'),continueBtn=$('continueBtn'),verifyBtn=$('verifyBtn'),resendBtn=$('resendBtn'),loginKnownBtn=$('loginKnownBtn'),backBtn=$('backBtn'),errorBox=$('formError'),intro=$('intro'),verifyText=$('verifyText'),accountName=$('accountName'),accountText=$('accountText'),secondaryDisplay=$('secondaryDisplay');
let pending={email:'',school_id:'',request:0},teacherRecord=null;
const hide=e=>e.classList.add('hidden'),show=e=>e.classList.remove('hidden'),reset=()=>{identity.classList.remove('hidden');hide(otpStep);hide(known);hide(backBtn);errorBox.textContent='';intro.textContent='Enter the school email and staff ID issued to you.';teacherRecord=null};
async function callLogin(body){const res=await supabase.functions.invoke('teacher-login',{body});if(res.error&&res.error.context?.json){}return res.data||null}
async function resolveTeacher(){const em=email.value.trim().toLowerCase(),sid=schoolId.value.trim().toUpperCase();if(!em||!sid)throw new Error('Enter both your School Email and Staff ID.');const data=await callLogin({email:em,school_id:sid});if(data?.ok)return{data,mode:'ready'};if(data?.requires_confirmation)return{data,mode:'otp'};throw new Error(data?.error||'The School Email and Staff ID could not be verified.');}
form.addEventListener('submit',async e=>{e.preventDefault();errorBox.textContent='';setLoading(continueBtn,true,'Checking account…');try{pending.email=email.value.trim().toLowerCase();pending.school_id=schoolId.value.trim().toUpperCase();const result=await resolveTeacher();if(result.mode==='otp'){intro.textContent='Your teacher record was found, but confirmation is still required.';verifyText.textContent=result.data.message||'We sent a 6-digit OTP to your primary school email. Enter it below to continue.';hide(identity);hide(known);show(otpStep);show(backBtn);otp.focus();toast('Verification code sent to your primary email.');return}throw new Error('This account needs the secondary-email sign-in flow. Please use your issued school email and staff ID.');}catch(err){errorBox.textContent=err.message||'Could not verify your teacher account.';toast(errorBox.textContent,'error')}finally{setLoading(continueBtn,false)}});
async function verifyCode(){errorBox.textContent='';const code=otp.value.trim();if(!/^\\d{6}$/.test(code)){errorBox.textContent='Enter the 6-digit verification code.';return}setLoading(verifyBtn,true,'Verifying…');try{const data=await callLogin({email:pending.email,school_id:pending.school_id,verification_code:code});if(!data?.ok)throw new Error(data?.error||'That code is invalid or expired.');await finishPasswordlessLogin(data.auth_email||pending.email,pending.school_id); }catch(err){errorBox.textContent=err.message||'Verification failed.';toast(errorBox.textContent,'error')}finally{setLoading(verifyBtn,false)}}
verifyBtn.addEventListener('click',verifyCode);otp.addEventListener('input',()=>{otp.value=otp.value.replace(/\\D/g,'').slice(0,6)});resendBtn.addEventListener('click',async()=>{errorBox.textContent='';setLoading(resendBtn,true,'Sending…');try{const data=await callLogin({email:pending.email,school_id:pending.school_id});if(!data?.requires_confirmation)throw new Error(data?.error||'A new code could not be sent.');toast('A new verification code was sent.')}catch(err){errorBox.textContent=err.message||'Could not resend the code.';toast(errorBox.textContent,'error')}finally{setLoading(resendBtn,false)}});
async function finishPasswordlessLogin(authEmail,password){const{error}=await supabase.auth.signInWithPassword({email:authEmail,password});if(error)throw new Error('Your teacher account was verified, but the secure sign-in could not be completed. Please try again.');toast('Sign-in successful. Opening your teacher dashboard…');window.location.replace('index.html?signin=new')}
async function findKnownTeacher(){errorBox.textContent='';const sid=schoolId.value.trim().toUpperCase();if(!sid)throw new Error('Enter your Staff ID first.');const{data,error}=await supabase.from('teachers').select('id,staff_id,full_name,school_email,email,secondary_email,email_confirmation_mode,email_confirmed,is_active,user_id').ilike('staff_id',sid).maybeSingle();if(error)throw error;if(!data||!data.is_active)throw new Error('No active teacher account was found for that Staff ID.');const school=String(data.school_email||data.email||'').trim().toLowerCase();const typed=email.value.trim().toLowerCase();if(!typed||typed!==school)throw new Error('Enter the exact School Email issued to the teacher for this Staff ID.');if(!data.email_confirmed) {const result=await callLogin({email:typed,school_id:sid});if(result?.requires_confirmation){pending={email:typed,school_id:sid};verifyText.textContent=result.message;hide(identity);hide(known);show(otpStep);show(backBtn);otp.focus();return}if(!result?.ok)throw new Error(result?.error||'This account is not confirmed yet.');}teacherRecord=data;accountName.textContent=data.full_name||'Teacher account found';accountText.textContent='Your teacher account is confirmed. We found the secondary email attached to this staff record.';secondaryDisplay.value=data.secondary_email||'No secondary email registered';hide(identity);hide(otpStep);show(known);show(backBtn);}
email.addEventListener('blur',async()=>{if(!schoolId.value.trim()||!email.value.trim())return;try{const sid=schoolId.value.trim().toUpperCase();const{data}=await supabase.from('teachers').select('full_name,secondary_email,email_confirmation_mode,email_confirmed,is_active,school_email,email').ilike('staff_id',sid).maybeSingle();if(!data||!data.is_active)return;const expected=String(data.school_email||data.email||'').trim().toLowerCase();if(expected!==email.value.trim().toLowerCase())return;if(data.email_confirmed===true){accountName.textContent=data.full_name||'Teacher account found';accountText.textContent='Your account has already been confirmed. Your registered secondary email is ready for sign-in.';secondaryDisplay.value=data.secondary_email||'No secondary email registered';} }catch(_){}});
loginKnownBtn.addEventListener('click',async()=>{errorBox.textContent='';setLoading(loginKnownBtn,true,'Signing in…');try{if(!teacherRecord)await findKnownTeacher();if(!teacherRecord)throw new Error('Please complete verification first.');if(!teacherRecord.secondary_email)throw new Error('No secondary email is registered for this teacher account. Please contact the school administrator.');await finishPasswordlessLogin(teacherRecord.secondary_email,schoolId.value.trim().toUpperCase());}catch(err){errorBox.textContent=err.message||'Could not sign you in.';toast(errorBox.textContent,'error')}finally{setLoading(loginKnownBtn,false)}});
backBtn.addEventListener('click',()=>reset());
</script><style>.login-page{min-height:100vh;background:radial-gradient(circle at 20% 20%,#eaf1ff,transparent 35%),#f6f8fc;display:grid;place-items:center}.login-wrap{width:min(470px,92%)}.login-card{background:#fff;border:1px solid #e6eaf0;border-radius:24px;padding:36px;box-shadow:0 25px 70px rgba(18,61,143,.12);animation:rise .5s ease}.login-logo{width:78px;height:78px;border-radius:50%;display:block;margin:0 auto 18px}.login-card .eyebrow{text-align:center}.login-card h1{text-align:center;margin:6px 0;font-size:27px}.muted{text-align:center;color:#667085;font-size:13px;margin-bottom:28px}label{display:block;font-size:12px;font-weight:700;margin:16px 0}input{width:100%;margin-top:7px;padding:13px;border:1px solid #dfe4ec;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px #0a66c21a}.full{width:100%;margin-top:10px}.form-error{color:#c62828;font-size:12px;min-height:17px}.hidden{display:none}.verify-box,.account-box{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #dbe7f8;background:#f6f9ff;border-radius:14px;margin:12px 0 18px}.verify-icon,.account-check{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#eaf2ff;color:#0a66c2;font-weight:800;flex:0 0 34px}.account-check{background:#e9f8ef;color:#16834b;border-radius:50%}.verify-box strong,.account-box strong{display:block;font-size:11px}.verify-box p,.account-box p{margin:4px 0 0;color:#667085;font-size:10px;line-height:1.5}.otp-actions{display:grid;gap:9px}.text-btn,.back-btn{border:0;background:transparent;color:#0a66c2;font-weight:800;font-size:11px;cursor:pointer;padding:8px}.back-btn{display:block;margin:13px auto 0}.btn:disabled,.text-btn:disabled{opacity:.65;cursor:not-allowed}</style></body></html>
