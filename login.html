<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"></head><body class="login-page"><div class="login-wrap"><div class="login-card"><img class="login-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><p class="eyebrow">LAFF BRITISH MONTESSORI SCHOOL</p><h1>Teacher Portal</h1><p class="muted">Sign in to manage your classes and academic work.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username" placeholder="teacher@school.com"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></label><button class="btn full" id="submit" type="submit">Sign in</button><p id="formError" class="form-error"></p></form></div></div><div id="toast-host"></div><script type="module">import{setLoading,supabase,toast}from'./assets/app.js';loginForm.onsubmit=async e=>{e.preventDefault();setLoading(submit,true,'Signing in…');formError.textContent='';try{const{error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;toast('Login successful. Welcome back!');setTimeout(()=>location.replace('index.html'),450)}catch(x){formError.textContent='Incorrect email or password, or your teacher account is not active.';toast(formError.textContent,'error')}finally{setLoading(submit,false)}};</script><style>.login-page{min-height:100vh;background:radial-gradient(circle at 20% 20%,#eaf1ff,transparent 35%),#f6f8fc;display:grid;place-items:center}.login-wrap{width:min(440px,92%)}.login-card{background:#fff;border:1px solid #e6eaf0;border-radius:22px;padding:36px;box-shadow:0 25px 70px rgba(18,61,143,.12);animation:rise .5s ease}.login-logo{width:78px;height:78px;border-radius:50%;display:block;margin:0 auto 18px}.login-card .eyebrow{text-align:center}.login-card h1{text-align:center;margin:6px 0;font-size:27px}.muted{text-align:center;color:#667085;font-size:13px;margin-bottom:28px}label{display:block;font-size:12px;font-weight:700;margin:16px 0}input{width:100%;margin-top:7px;padding:13px;border:1px solid #dfe4ec;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px #0a66c21a}.full{width:100%;margin-top:10px}.form-error{color:#c62828;font-size:12px;min-height:17px}</style></body></html>
