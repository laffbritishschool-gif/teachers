<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login | Laff British Montessori School</title><meta name="description" content="Secure Laff British Montessori School teacher portal access using your school email and staff ID."><link rel="stylesheet" href="assets/styles.css"></head><body class="login-page"><div class="login-wrap"><div class="login-card"><img class="login-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><p class="eyebrow">LBS TEACHER ACCESS</p><h1>Teacher Portal</h1><p class="muted" id="intro">Enter the school email and staff ID issued to you.</p><form id="loginForm"><section id="identityStep"><label for="email">School Email<input id="email" type="email" required autocomplete="email" placeholder="teacher@laffbritishmontesorrischool.com"></label><label for="schoolId">Staff ID<input id="schoolId" required autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. TCH-123456"></label><button class="btn full" id="continueBtn" type="submit">Continue</button></section><section id="otpStep" class="hidden"><div class="verify-box"><div class="verify-icon">✉</div><div><strong>Verification required</strong><p id="verifyText">Your registered email has not been confirmed yet. We sent a 6-digit OTP to your primary email address.</p></div></div><label for="otp">Verification code<input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label><div class="otp-actions"><button class="btn full" id="verifyBtn" type="button">Verify &amp; sign in</button><button class="text-btn" id="resendBtn" type="button">Resend code</button></div></section><section id="knownAccount" class="hidden"><div class="account-box"><span class="account-check">✓</span><div><strong id="accountName">Teacher account found</strong><p id="accountText">Your confirmed teacher account was found.</p></div></div><label for="secondaryDisplay">Registered secondary email<input id="secondaryDisplay" type="text" readonly></label><button class="btn full" id="loginKnownBtn" type="button">Sign in securely</button></section><p id="formError" class="form-error"></p></form><button id="backBtn" class="back-btn hidden" type="button">← Use different details</button></div></div><div id="toast-host"></div><script type="module">
import{setLoading,supabase,toast}from'./assets/app.js';
const $=id=>document.getElementById(id);
const form=$('loginForm'),identity=$('identityStep'),otpStep=$('otpStep'),known=$('knownAccount'),email=$('email'),schoolId=$('schoolId'),otp=$('otp'),continueBtn=$('continueBtn'),verifyBtn=$('verifyBtn'),resendBtn=$('resendBtn'),loginKnownBtn=$('loginKnownBtn'),backBtn=$('backBtn'),errorBox=$('formError'),intro=$('intro'),verifyText=$('verifyText'),accountName=$('accountName'),accountText=$('accountText'),secondaryDisplay=$('secondaryDisplay');
let pending={email:'',school_id:''},teacherRecord=null;
const hide=e=>e.classList.add('hidden'),show=e=>e.classList.remove('hidden');
function reset(){identity.classList.remove('hidden');hide(otpStep);hide(known);hide(backBtn);errorBox.textContent='';intro.textContent='Enter the school email and staff ID issued to you.';teacherRecord=null;}
async function loginCheck(extra={}){const r=await supabase.functions.invoke('teacher-login',{body:{email:email.value.trim().toLowerCase(),school_id:schoolId.value.trim().toUpperCase(),...extra}});if(r.error&&r.data?.error)throw new Error(r.data.error);if(r.error)throw new Error(r.error.message||'Teacher login service is unavailable.');return r.data;}
async function finish(authEmail,password){const{error}=await supabase.auth.signInWithPassword({email:authEmail,password});if(error)throw new Error('Your details were verified, but secure sign-in could not be completed. Please contact the school administrator.');toast('Sign-in successful. Opening your teacher dashboard…');location.replace('index.html?signin=returning');}
async function sendOtpAndShow(data){pending={email:email.value.trim().toLowerCase(),school_id:schoolId.value.trim().toUpperCase()};verifyText.textContent=(data.message||'A 6-digit OTP has been sent. Enter it to continue.')+(data.verification_email?' Sent to: '+data.verification_email+'.':'');hide(identity);hide(known);show(otpStep);show(backBtn);otp.focus();toast('Verification code sent.');}
form.addEventListener('submit',async e=>{e.preventDefault();errorBox.textContent='';setLoading(continueBtn,true,'Checking account…');try{
 const sid=schoolId.value.trim().toUpperCase(),em=email.value.trim().toLowerCase();if(!sid||!em)throw new Error('Enter both your School Email and Staff ID.');
 const result=await loginCheck();
 if(result?.ok&&result?.confirmed){teacherRecord=result;accountName.textContent=result.full_name||'Teacher account confirmed';accountText.textContent='Your account has already been confirmed. The registered secondary email was found for this Staff ID.';secondaryDisplay.value=result.secondary_email||'No secondary email registered';hide(identity);hide(otpStep);show(known);show(backBtn);setTimeout(async()=>{try{if(!result.secondary_email)throw new Error('No secondary email is registered for this teacher account. Please contact the school administrator.');await finish(result.secondary_email,sid)}catch(err){errorBox.textContent=err.message||'Could not complete secure sign-in.';toast(errorBox.textContent,'error')}},700);return;}
 if(result?.requires_confirmation){await sendOtpAndShow(result);return;}
 throw new Error(result?.error||'The School Email and Staff ID could not be verified.');
}catch(err){errorBox.textContent=err.message||'Could not verify your teacher account.';toast(errorBox.textContent,'error')}finally{setLoading(continueBtn,false)}});
verifyBtn.addEventListener('click',async()=>{errorBox.textContent='';const code=otp.value.trim();if(!/^\d{6}$/.test(code)){errorBox.textContent='Enter the 6-digit verification code.';return;}setLoading(verifyBtn,true,'Verifying…');try{const result=await supabase.functions.invoke('teacher-login',{body:{email:pending.email,school_id:pending.school_id,verification_code:code}});if(result.error||!result.data?.ok)throw new Error(result.data?.error||result.error?.message||'That verification code is invalid or expired.');await finish(result.data.auth_email||result.data.secondary_email||pending.email,pending.school_id);}catch(err){errorBox.textContent=err.message||'Verification failed.';toast(errorBox.textContent,'error')}finally{setLoading(verifyBtn,false)}});
otp.addEventListener('input',()=>{otp.value=otp.value.replace(/\D/g,'').slice(0,6)});
resendBtn.addEventListener('click',async()=>{errorBox.textContent='';setLoading(resendBtn,true,'Sending…');try{const result=await supabase.functions.invoke('teacher-login',{body:{email:pending.email,school_id:pending.school_id}});if(!result.data?.requires_confirmation)throw new Error(result.data?.error||'A new code could not be sent.');toast('A new verification code was sent.')}catch(err){errorBox.textContent=err.message||'Could not resend the code.';toast(errorBox.textContent,'error')}finally{setLoading(resendBtn,false)}});
loginKnownBtn.addEventListener('click',async()=>{errorBox.textContent='';setLoading(loginKnownBtn,true,'Signing in…');try{if(!teacherRecord)teacherRecord=await loginCheck();if(!teacherRecord?.ok)throw new Error(teacherRecord?.error||'Teacher account could not be verified.');if(!teacherRecord.secondary_email)throw new Error('No secondary email is registered for this teacher account. Please contact the school administrator.');await finish(teacherRecord.secondary_email,schoolId.value.trim().toUpperCase());}catch(err){errorBox.textContent=err.message||'Could not sign you in.';toast(errorBox.textContent,'error')}finally{setLoading(loginKnownBtn,false)}});
backBtn.addEventListener('click',reset);
</script><style>.login-page{min-height:100vh;background:radial-gradient(circle at 20% 20%,#eaf1ff,transparent 35%),#f6f8fc;display:grid;place-items:center}.login-wrap{width:min(470px,92%)}.login-card{background:#fff;border:1px solid #e6eaf0;border-radius:24px;padding:36px;box-shadow:0 25px 70px rgba(18,61,143,.12);animation:rise .5s ease}.login-logo{width:78px;height:78px;border-radius:50%;display:block;margin:0 auto 18px}.login-card .eyebrow{text-align:center}.login-card h1{text-align:center;margin:6px 0;font-size:27px}.muted{text-align:center;color:#667085;font-size:13px;margin-bottom:28px}label{display:block;font-size:12px;font-weight:700;margin:16px 0}input{width:100%;margin-top:7px;padding:13px;border:1px solid #dfe4ec;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px #0a66c21a}.full{width:100%;margin-top:10px}.form-error{color:#c62828;font-size:12px;min-height:17px}.hidden{display:none}.verify-box,.account-box{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #dbe7f8;background:#f6f9ff;border-radius:14px;margin:12px 0 18px}.verify-icon,.account-check{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#eaf2ff;color:#0a66c2;font-weight:800;flex:0 0 34px}.account-check{background:#e9f8ef;color:#16834b;border-radius:50%}.verify-box strong,.account-box strong{display:block;font-size:11px}.verify-box p,.account-box p{margin:4px 0 0;color:#667085;font-size:10px;line-height:1.5}.otp-actions{display:grid;gap:9px}.text-btn,.back-btn{border:0;background:transparent;color:#0a66c2;font-weight:800;font-size:11px;cursor:pointer;padding:8px}.back-btn{display:block;margin:13px auto 0}.btn:disabled,.text-btn:disabled{opacity:.65;cursor:not-allowed}</style></body></html>
