<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Student Results | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/result-workspace.css"><link rel="stylesheet" href="assets/portal-loader.css">
<style>
.bulk-page{display:grid;gap:17px;max-width:1120px}.bulk-hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,#082b63,#0b5ed7);color:#fff}.bulk-hero h2{margin:9px 0 5px;font-size:27px}.bulk-hero p{margin:0;color:#dce8fb;font-size:12px}.bulk-student{display:flex;gap:14px;align-items:center;padding:17px;background:#fff;border:1px solid #e3e9f2;border-radius:18px}.bulk-student h3{margin:0 0 7px}.bulk-meta{display:flex;flex-wrap:wrap;gap:7px}.bulk-meta span{padding:5px 8px;background:#f3f6fb;border-radius:99px;color:#667085;font-size:10px}.bulk-selectors{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:18px;background:#fff;border:1px solid #e3e9f2;border-radius:17px}.bulk-selectors label{display:grid;gap:7px;color:#667085;font-size:11px;font-weight:800}.bulk-selectors select,.entry-row select,.entry-row input,.entry-row textarea{width:100%;box-sizing:border-box;border:1px solid #dce4ef;border-radius:10px;padding:11px;background:#fff;color:#13233f;font:inherit}.bulk-selectors select{min-height:45px}.bulk-subjects{display:grid;gap:12px}.entry-row{display:grid;grid-template-columns:minmax(170px,1.25fr) repeat(2,minmax(110px,.7fr)) minmax(160px,1fr) 38px;gap:10px;align-items:end;padding:15px;background:#fff;border:1px solid #e3e9f2;border-radius:15px}.entry-field{display:grid;gap:6px;color:#667085;font-size:10px;font-weight:800}.entry-row textarea{min-height:41px;resize:vertical}.entry-remove{width:36px;height:40px;border:0;border-radius:10px;background:#fff0f0;color:#c03939;font-size:19px;cursor:pointer}.entry-remove:disabled{opacity:.35;cursor:not-allowed}.entry-max{font-size:10px;color:#98a2b3;font-weight:500}.entry-total{grid-column:1/-1;display:flex;justify-content:space-between;padding-top:9px;border-top:1px solid #edf1f6;color:#667085;font-size:11px}.entry-total strong{color:#0b5ed7}.bulk-existing{padding:13px 15px;background:#f7fafc;border:1px solid #e3e9f2;border-radius:13px;color:#667085;font-size:12px}.bulk-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:#fff;border:1px solid #e3e9f2;border-radius:16px}.bulk-actions{display:flex;gap:8px;flex-wrap:wrap}.bulk-note{font-size:11px;color:#667085;line-height:1.5}.bulk-add{display:flex;justify-content:flex-start}.bulk-add button{border:1px dashed #0b5ed7;background:#f3f7ff;color:#0b5ed7;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.bulk-empty{padding:22px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px;color:#667085;font-size:12px}.bulk-table-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bulk-table-head h3{margin:0}.bulk-table-head p{margin:5px 0 0;color:#667085;font-size:11px}@media(max-width:760px){.entry-row{grid-template-columns:1fr 1fr}.entry-subject-wrap,.entry-remark{grid-column:1/-1}.entry-remove{grid-column:2;grid-row:1;justify-self:end}.entry-total{grid-column:1/-1}}@media(max-width:560px){.bulk-selectors{grid-template-columns:1fr}.bulk-hero h2{font-size:23px}.bulk-student{align-items:flex-start}.entry-row{grid-template-columns:1fr 1fr}.entry-subject,.entry-remark{grid-column:1/-1}}
</style></head>
<body data-title="Add Results"><div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Preparing Result Sheet</div><div class="lbs-loader-text">Loading student and class details…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div><div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast,getCachedSchoolSettings}from'./assets/app.js';
const esc=escapeHtml,p=new URLSearchParams(location.search),studentId=p.get('studentid')||p.get('id'),classIdParam=p.get('classid')||p.get('class'),loader=document.querySelector('#page-loader');
let user,enrollment,subjects=[],sessions=[],terms=[],settings=getCachedSchoolSettings(),selectedSession='',selectedTerm='',existing=new Map(),rowCounter=0;
const hide=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
const grade=n=>{const r=(settings.grading_rules||[]).find(x=>Number(n)>=Number(x.min)&&Number(n)<=Number(x.max));return r?.grade||'F'};
const point=n=>{const r=(settings.grading_rules||[]).find(x=>Number(n)>=Number(x.min)&&Number(n)<=Number(x.max));return r?.point??0};
function render(html){const s=document.querySelector('#app-shell');s.dataset.content=html;mountShell(user)}
function studentInfo(){const s=enrollment.students||{},name=[s.first_name,s.middle_name,s.last_name].filter(Boolean).join(' ');return '<section class="bulk-student"><div class="detail-avatar">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'" alt="">':esc(((s.first_name||'')[0]||'')+((s.last_name||'')[0]||'')))+'</div><div><h3>'+esc(name||'Student')+'</h3><div class="bulk-meta"><span>Student ID: '+esc(s.student_id||'—')+'</span><span>Exam No: '+esc(s.exam_number||'—')+'</span><span>Class: '+esc(enrollment.classes?.name||'—')+'</span><span>Level: '+esc(enrollment.classes?.level||'—')+'</span></div></div></section>'}
function renderShell(){const sessionOptions=sessions.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');render('<div class="bulk-page"><section class="bulk-hero"><span class="hero-kicker">TEACHER RESULT ENTRY</span><h2>Add Student Results</h2><p>Choose the academic session and term first. Then add the subjects you are entering results for.</p></section>'+studentInfo()+'<section class="bulk-selectors"><label>Academic Session<select id="session-select"><option value="">Select academic session</option>'+sessionOptions+'</select></label><label>Term / Examination<select id="term-select" disabled><option value="">Select a session first</option></select></label></section><section id="entry-workspace" hidden><div class="bulk-table-head"><div><h3>Subject Results</h3><p id="term-caption">Choose subjects and enter their scores below.</p></div><a class="btn secondary" href="results.html?class='+encodeURIComponent(enrollment.class_id)+'">← Back to Students</a></div><div id="existing-results" class="bulk-existing" hidden></div><div id="subject-rows" class="bulk-subjects"></div><div class="bulk-add"><button type="button" id="add-subject">＋ Add another subject</button></div><div class="bulk-footer"><div class="bulk-note">Only rows with a selected subject and both scores will be saved. Results are saved under the selected session and term only.</div><div class="bulk-actions"><button class="btn secondary" id="save-draft" type="button">Save as Draft</button><button class="btn" id="submit-results" type="button">Submit Selected Results</button></div></div><div id="bulk-message" class="bulk-note" aria-live="polite"></div></section></div>');const ss=document.querySelector('#session-select');ss.value=selectedSession;ss.onchange=()=>{selectedSession=ss.value;selectedTerm='';populateTerms()};document.querySelector('#term-select').onchange=async e=>{selectedTerm=e.target.value;if(selectedTerm)await loadTermResults();};document.querySelector('#add-subject').onclick=()=>addRow();document.querySelector('#save-draft').onclick=()=>save('DRAFT');document.querySelector('#submit-results').onclick=()=>save('SUBMITTED')}
function populateTerms(){const sel=document.querySelector('#term-select'),rows=terms.filter(x=>String(x.session_id)===String(selectedSession));sel.disabled=!selectedSession;sel.innerHTML='<option value="">Select term / examination</option>'+rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');document.querySelector('#entry-workspace').hidden=true;if(!rows.length&&selectedSession)toast('No terms are configured for this academic session.','error')}
function usedSubjects(){return [...document.querySelectorAll('.entry-row')].map(r=>r.querySelector('.entry-subject').value).filter(Boolean)}
function refreshSubjectOptions(){const used=usedSubjects();document.querySelectorAll('.entry-row').forEach(row=>{const select=row.querySelector('.entry-subject'),current=select.value;select.innerHTML='<option value="">Choose a subject</option>'+subjects.filter(s=>!used.includes(s.id)||s.id===current).map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+(s.code?' · '+esc(s.code):'')+'</option>').join('');select.value=current;const sub=subjects.find(s=>s.id===current);row.querySelector('.entry-ca').max=Number(sub?.max_ca??40);row.querySelector('.entry-exam').max=Number(sub?.max_exam??60);row.querySelector('.entry-ca-max').textContent='Max '+Number(sub?.max_ca??40);row.querySelector('.entry-exam-max').textContent='Max '+Number(sub?.max_exam??60);row.querySelector('.entry-remove').disabled=document.querySelectorAll('.entry-row').length===1;})}
function addRow(){const box=document.querySelector('#subject-rows');if(!box)return;const id=++rowCounter,used=usedSubjects();const available=subjects.filter(s=>!used.includes(s.id)&&!existing.has(s.id));if(!available.length){toast('All available subjects have been selected or already have results.','info');return}const row=document.createElement('article');row.className='entry-row';row.dataset.row=id;row.innerHTML='<label class="entry-field entry-subject-wrap">Subject<select class="entry-subject"><option value="">Choose a subject</option></select></label><label class="entry-field">CA Score <span class="entry-ca-max"></span><input class="entry-ca" type="number" min="0" step="0.01" placeholder="0"></label><label class="entry-field">Exam Score <span class="entry-exam-max"></span><input class="entry-exam" type="number" min="0" step="0.01" placeholder="0"></label><label class="entry-field entry-remark">Teacher Remark<textarea class="entry-remark-input" maxlength="500" placeholder="Optional remark"></textarea></label><button class="entry-remove" type="button" title="Remove subject row" aria-label="Remove subject row">×</button><div class="entry-total"><span>Total: <strong class="entry-sum">0</strong></span><span>Grade: <b class="entry-grade">—</b> · Point: <b class="entry-point">—</b></span></div>';box.appendChild(row);row.querySelector('.entry-subject').onchange=refreshSubjectOptions;row.querySelectorAll('.entry-ca,.entry-exam').forEach(input=>input.oninput=()=>updateRow(row));row.querySelector('.entry-remove').onclick=()=>{row.remove();refreshSubjectOptions()};refreshSubjectOptions()}
function updateRow(row){const ca=Number(row.querySelector('.entry-ca').value||0),exam=Number(row.querySelector('.entry-exam').value||0),total=ca+exam;row.querySelector('.entry-sum').textContent=total.toFixed(2).replace(/\.00$/,'');row.querySelector('.entry-grade').textContent=row.querySelector('.entry-subject').value?grade(total):'—';row.querySelector('.entry-point').textContent=row.querySelector('.entry-subject').value?point(total):'—'}
async function loadTermResults(){const termId=selectedTerm,term=terms.find(x=>x.id===termId);if(!term)return;const workspace=document.querySelector('#entry-workspace'),box=document.querySelector('#subject-rows'),existingBox=document.querySelector('#existing-results');workspace.hidden=false;box.innerHTML='<div class="bulk-empty">Loading results for this term…</div>';document.querySelector('#term-caption').textContent=(sessions.find(x=>x.id===selectedSession)?.name||'')+' · '+term.name;try{const{data:r,error}=await supabase.from('results').select('id,subject_id,status').eq('enrollment_id',enrollment.id).eq('term_id',termId);if(error)throw error;existing=new Map((r||[]).map(x=>[x.subject_id,x]));const locked=subjects.filter(s=>existing.has(s.id));existingBox.hidden=!locked.length;existingBox.textContent=locked.length?'Already recorded for this term: '+locked.map(s=>s.name+' ('+(existing.get(s.id)?.status||'saved')+')').join(' · '):'No results have been recorded for this term yet.';box.innerHTML='';const available=subjects.filter(s=>!existing.has(s.id));if(available.length)addRow();else box.innerHTML='<div class="bulk-empty">All assigned subjects already have results for this term.</div>';refreshSubjectOptions()}catch(e){console.error(e);box.innerHTML='<div class="bulk-empty">Could not load existing results for this term.</div>';toast(e.message||'Could not load term results.','error')}}
async function save(status){const buttons=[document.querySelector('#save-draft'),document.querySelector('#submit-results')],msg=document.querySelector('#bulk-message');try{buttons.forEach(b=>b.disabled=true);const term=terms.find(x=>x.id===selectedTerm);if(!term)throw new Error('Select an academic term first.');const payload=[];for(const row of document.querySelectorAll('.entry-row')){const subjectId=row.querySelector('.entry-subject').value,caText=row.querySelector('.entry-ca').value,examText=row.querySelector('.entry-exam').value;if(!subjectId&&!caText&&!examText)continue;if(!subjectId)throw new Error('Choose a subject for every row with scores.');if(caText===''||examText==='')throw new Error('Enter both CA and examination scores for each selected subject.');const sub=subjects.find(s=>s.id===subjectId),ca=Number(caText),exam=Number(examText),maxCa=Number(sub.max_ca??40),maxExam=Number(sub.max_exam??60);if(!Number.isFinite(ca)||ca<0||ca>maxCa)throw new Error(sub.name+': CA must be between 0 and '+maxCa+'.');if(!Number.isFinite(exam)||exam<0||exam>maxExam)throw new Error(sub.name+': Exam must be between 0 and '+maxExam+'.');const total=ca+exam;payload.push({enrollment_id:enrollment.id,term_id:term.id,subject_id:sub.id,ca_score:ca,exam_score:exam,grade:grade(total),grade_point:point(total),teacher_remark:row.querySelector('.entry-remark-input').value.trim()||null,created_by:user.id,status})}if(!payload.length)throw new Error('Select at least one subject and enter its scores.');const ids=payload.map(x=>x.subject_id);if(new Set(ids).size!==ids.length)throw new Error('A subject can only be selected once.');const{error}=await supabase.from('results').insert(payload);if(error)throw error;toast(status==='SUBMITTED'?'Selected term results submitted to the administrator.':'Selected term results saved as drafts.');msg.textContent=payload.length+' subject result(s) '+(status==='SUBMITTED'?'submitted':'saved as draft')+' for '+term.name+'.';setTimeout(()=>location.href='results.html?class='+encodeURIComponent(enrollment.class_id),1000)}catch(e){console.error(e);msg.textContent=e.message||'Results could not be saved.';toast(msg.textContent,'error')}finally{buttons.forEach(b=>b.disabled=false)}}
async function load(){if(!studentId)throw new Error('No student was selected. Return to Enter Results and choose a student.');const sr=await supabase.from('school_settings').select('*').limit(1).maybeSingle();if(!sr.error&&sr.data)settings=sr.data;const{data:e,error:ee}=await supabase.from('enrollments').select('id,student_id,class_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url),classes(id,name,level)').eq('student_id',studentId).eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();if(ee)throw ee;if(!e)throw new Error('Active student enrollment not found.');enrollment=e;if(classIdParam&&String(classIdParam)!==String(e.class_id))throw new Error('The selected class does not match this student enrollment.');const{data:a,error:ae}=await supabase.from('class_subjects').select('id,class_id,subject_id,teacher_id,subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).eq('class_id',e.class_id).order('id');if(ae)throw ae;subjects=(a||[]).filter(x=>x.subjects?.is_active).map(x=>x.subjects).filter((s,i,arr)=>arr.findIndex(x=>x.id===s.id)===i);if(!subjects.length)throw new Error('No active subjects are assigned to you for this class.');const{data:ss,error:se}=await supabase.from('academic_sessions').select('id,name');if(se)throw se;sessions=ss||[];const{data:tt,error:te}=await supabase.from('terms').select('id,name,session_id,starts_on').order('starts_on',{ascending:true});if(te)throw te;terms=tt||[];if(!sessions.length)throw new Error('No academic sessions have been configured.');renderShell();selectedSession='';document.querySelector('#session-select').value='';populateTerms()}
try{user=await requireTeacher();if(user){const{data:t,error}=await supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...t};await load()}}catch(e){console.error(e);if(user){render('<div class="form-page"><section class="score-card"><h2>Result sheet unavailable</h2><p>'+esc(e.message||'Could not load this student.')+'</p><a class="btn" href="results.html">Back to Enter Results</a></section></div>')}toast(e.message||'Could not load the result sheet.','error')}finally{hide()}
</script></body></html>
