<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Result | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/result-workspace.css"><link rel="stylesheet" href="assets/portal-loader.css"></head><body data-title="Add Result"><div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Opening Result Form</div><div class="lbs-loader-text">Preparing the student's class and subject details…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div><div id="app-shell"></div><div id="toast-host"></div><script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast,getCachedSchoolSettings}from'./assets/app.js';
const esc=escapeHtml,p=new URLSearchParams(location.search),studentId=p.get('studentid')||p.get('id'),classId=p.get('classid')||p.get('class'),subjectId=p.get('subjectid')||p.get('subject');let user,term,assignment,schoolSettings=getCachedSchoolSettings(),enrollment,subject;
const loader=document.querySelector('#page-loader');const hide=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};const initials=(a,b)=>`${(a||'')[0]||''}${(b||'')[0]||''}`.toUpperCase();const gradeFrom=(n,rules)=>{const score=Number(n)||0;const hit=(rules||[]).find(x=>score<=Number(x.max)&&score>=Number(x.min));return hit?.grade||'F'};const pointFrom=(n,rules)=>{const score=Number(n)||0;const hit=(rules||[]).find(x=>score<=Number(x.max)&&score>=Number(x.min));return hit?.point??0};
function render(html){const s=document.querySelector('#app-shell');s.dataset.content=html;mountShell(user)}
function detailCard(){const s=enrollment.students||{},name=`${s.first_name||''} ${s.middle_name||''} ${s.last_name||''}`.replace(/\s+/g,' ').trim();return `<section class="student-detail-card"><div class="detail-avatar">${s.photo_url?`<img src="${esc(s.photo_url)}" alt="">`:esc(initials(s.first_name,s.last_name))}</div><div><h3 style="margin:0;color:#13233f">${esc(name||'Student')}</h3><p style="margin:4px 0;color:#667085;font-size:11px">Adding result for ${esc(subject?.name||'Subject')} · ${esc(term.name)}</p><div class="detail-grid"><div class="detail-item"><small>Student ID</small><b>${esc(s.student_id||'—')}</b></div><div class="detail-item"><small>Exam Number</small><b>${esc(s.exam_number||'—')}</b></div><div class="detail-item"><small>Class</small><b>${esc(enrollment.classes?.name||'—')}</b></div><div class="detail-item"><small>Level</small><b>${esc(enrollment.classes?.level||'—')}</b></div><div class="detail-item"><small>Date of Birth</small><b>${esc(s.date_of_birth||'—')}</b></div><div class="detail-item"><small>Gender</small><b>${esc(s.gender||'—')}</b></div><div class="detail-item"><small>Guardian</small><b>${esc(s.guardian_name||'—')}</b></div><div class="detail-item"><small>Guardian Phone</small><b>${esc(s.guardian_phone||'—')}</b></div></div></div></section>`}
function renderForm(){render(`<div class="form-page"><section class="form-hero"><div><span class="hero-kicker">NEW RESULT</span><h2>Add Student Result</h2><p>${esc(subject.name)} · ${esc(term.name)} · ${esc(term.academic_sessions?.name||'Academic Session')}</p></div><a class="btn secondary" href="results.html?class=${encodeURIComponent(enrollment.class_id)}&subject=${encodeURIComponent(subject.id)}">← Back to Students</a></section>${detailCard()}<form id="result-form" class="score-card"><div class="panel-head"><div><h3 style="margin:0">Academic Scores</h3><p style="margin:4px 0 0;color:#667085;font-size:11px">Enter the continuous assessment and examination scores. The total, grade and grade point are calculated automatically.</p></div></div><div class="score-grid"><div class="score-field"><label for="ca">CA Score</label><input id="ca" type="number" min="0" max="${Number(subject.max_ca||40)}" step="0.01" required><div class="score-helper">Maximum ${esc(subject.max_ca??0)} marks</div></div><div class="score-field"><label for="exam">Exam Score</label><input id="exam" type="number" min="0" max="${Number(subject.max_exam||60)}" step="0.01" required><div class="score-helper">Maximum ${esc(subject.max_exam??0)} marks</div></div><div class="score-field" style="grid-column:1/-1"><label for="remark">Teacher Remark</label><textarea id="remark" maxlength="500" placeholder="Optional comment about the student's performance..."></textarea></div></div><div class="score-preview"><div class="preview-item"><b id="total-preview">0</b><span>Total</span></div><div class="preview-item"><b id="grade-preview">F</b><span>Grade</span></div><div class="preview-item"><b id="point-preview">0</b><span>Grade Point</span></div><div class="preview-item"><b>${esc(Number(subject.max_ca||0)+Number(subject.max_exam||0))}</b><span>Maximum</span></div></div><div id="form-message" class="submission-note" style="margin-top:15px"></div><div class="form-footer"><div class="submission-note">Submitting sends this result to the administrator for review and publication. Teachers do not publish results.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" id="save-draft" type="button">Save Draft</button><button class="btn" id="submit-result" type="submit">Submit to Admin</button></div></div><div id="success" class="success-panel"></div></form></div>`);setupForm()}
function updatePreview(){const ca=Math.max(0,Number(document.querySelector('#ca')?.value||0)),exam=Math.max(0,Number(document.querySelector('#exam')?.value||0)),total=ca+exam;document.querySelector('#total-preview').textContent=total.toFixed(2).replace(/\.00$/,'');document.querySelector('#grade-preview').textContent=gradeFrom(total,schoolSettings.grading_rules);document.querySelector('#point-preview').textContent=pointFrom(total,schoolSettings.grading_rules)}
function validate(){const ca=Number(document.querySelector('#ca').value),exam=Number(document.querySelector('#exam').value);if(!Number.isFinite(ca)||ca<0||ca>Number(subject.max_ca))throw new Error(`CA score must be between 0 and ${subject.max_ca}.`);if(!Number.isFinite(exam)||exam<0||exam>Number(subject.max_exam))throw new Error(`Exam score must be between 0 and ${subject.max_exam}.`);return{ca,exam,total:ca+exam,grade:gradeFrom(ca+exam,schoolSettings.grading_rules),grade_point:pointFrom(ca+exam,schoolSettings.grading_rules)}}
async function save(status){const message=document.querySelector('#form-message'),buttons=[document.querySelector('#save-draft'),document.querySelector('#submit-result')];try{buttons.forEach(b=>{if(b)b.disabled=true});message.textContent='Saving result…';const v=validate();const remark=document.querySelector('#remark').value.trim();const payload={enrollment_id:enrollment.id,term_id:term.id,subject_id:subject.id,ca_score:v.ca,exam_score:v.exam,grade:v.grade,grade_point:v.grade_point,teacher_remark:remark||null,created_by:user.id,status};const{error}=await supabase.from('results').insert(payload);if(error)throw error;document.querySelector('#success').textContent=status==='SUBMITTED'?'Result submitted to the administrator successfully. The administrator can now review and publish it.':'Draft saved successfully. You can edit it from Enter Results.';document.querySelector('#success').classList.add('show');toast(status==='SUBMITTED'?'Result submitted to admin.':'Draft saved successfully.');setTimeout(()=>location.href=`results.html?class=${encodeURIComponent(enrollment.class_id)}&subject=${encodeURIComponent(subject.id)}`,900)}catch(e){console.error(e);message.textContent=e.message||'The result could not be saved.';toast(message.textContent,'error')}finally{buttons.forEach(b=>{if(b)b.disabled=false})}}
function setupForm(){document.querySelector('#ca').oninput=updatePreview;document.querySelector('#exam').oninput=updatePreview;document.querySelector('#save-draft').onclick=()=>save('DRAFT');document.querySelector('#result-form').onsubmit=e=>{e.preventDefault();save('SUBMITTED')}}
async function load(){if(!studentId)throw new Error('No student was selected.');const{data:t,error:te}=await supabase.from('terms').select('id,name,session_id,academic_sessions(name)').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle();if(te)throw te;if(!t)throw new Error('There is no current academic term configured.');term=t;schoolSettings=(await supabase.from('school_settings').select('*').limit(1).maybeSingle()).data||schoolSettings;const{data:e,error:ee}=await supabase.from('enrollments').select('id,student_id,class_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url,date_of_birth,gender,school_email,phone,address,guardian_name,guardian_phone),classes(id,name,level,description)').eq('student_id',studentId).eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();if(ee)throw ee;if(!e)throw new Error('Active student enrollment not found.');enrollment=e;const{data:cs,error:ce}=await supabase.from('class_subjects').select('id,class_id,subject_id,teacher_id,subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).eq('class_id',classId||e.class_id).eq('subject_id',subjectId).maybeSingle();if(ce)throw ce;if(!cs)throw new Error('This subject is not assigned to you for this student’s class.');assignment=cs;subject=cs.subjects;if(!subject?.is_active)throw new Error('This subject is inactive.');const existing=await supabase.from('results').select('id,status').eq('enrollment_id',enrollment.id).eq('term_id',term.id).eq('subject_id',subject.id).maybeSingle();if(existing.error)throw existing.error;if(existing.data)throw new Error('A result already exists for this student and subject. Use Edit Result instead.');renderForm()}
try{user=await requireTeacher();if(user){const{data:teacher}=await supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle();if(teacher)user.teacher={...user.teacher,...teacher};await load()}}catch(e){console.error(e);if(user){document.querySelector('#app-shell').dataset.content=`<div class="form-page"><section class="score-card"><h2>Result form unavailable</h2><p>${esc(e.message||'Could not load the selected student.')}</p><a class="btn" href="results.html">Back to Enter Results</a></section></div>`;mountShell(user)}toast(e.message||'Could not load the result form.','error')}finally{hide()}
</script></body></html>
