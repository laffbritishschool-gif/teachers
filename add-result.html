<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Student Results | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/result-workspace.css"><link rel="stylesheet" href="assets/portal-loader.css"><style>
.bulk-page{display:grid;gap:17px;max-width:1120px}.bulk-hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,#082b63,#0b5ed7);color:#fff}.bulk-hero h2{margin:9px 0 5px;font-size:27px}.bulk-hero p{margin:0;color:#dce8fb;font-size:12px}.bulk-student{display:flex;gap:14px;align-items:center;padding:17px;background:#fff;border:1px solid #e3e9f2;border-radius:18px}.bulk-student h3{margin:0 0 7px}.bulk-meta{display:flex;flex-wrap:wrap;gap:7px}.bulk-meta span{padding:5px 8px;background:#f3f6fb;border-radius:99px;color:#667085;font-size:10px}.bulk-subjects{display:grid;gap:12px}.bulk-card{padding:17px;background:#fff;border:1px solid #e3e9f2;border-radius:17px;display:grid;gap:13px}.bulk-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.bulk-head h3{margin:0;font-size:15px}.bulk-head p{margin:4px 0 0;color:#667085;font-size:11px}.bulk-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.bulk-fields label{display:grid;gap:6px;color:#667085;font-size:10px;font-weight:800;text-transform:uppercase}.bulk-fields input,.bulk-fields textarea{width:100%;box-sizing:border-box;border:1px solid #e3e9f2;border-radius:10px;padding:11px;font:inherit;color:#13233f}.bulk-fields textarea{min-height:42px;resize:vertical}.bulk-total{padding:10px 12px;border-radius:11px;background:#f3f7ff;display:flex;justify-content:space-between;color:#667085;font-size:11px}.bulk-total strong{color:#0b5ed7;font-size:17px}.bulk-existing{padding:7px 10px;border-radius:99px;background:#eaf8ef;color:#177245;font-size:10px;font-weight:900}.bulk-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:#fff;border:1px solid #e3e9f2;border-radius:16px}.bulk-actions{display:flex;gap:8px;flex-wrap:wrap}.bulk-note{font-size:11px;color:#667085;line-height:1.5}@media(max-width:650px){.bulk-fields{grid-template-columns:1fr}.bulk-student{align-items:flex-start}.bulk-hero h2{font-size:23px}}
</style></head><body data-title="Add Results"><div id="page-loader" class="lbs-loader" aria-live="polite"><div class="lbs-loader-card"><img class="lbs-loader-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><div class="lbs-loader-ring"></div><div class="lbs-loader-title">Preparing Result Sheet</div><div class="lbs-loader-text">Loading student and class subjects…</div><div class="lbs-loader-bar"></div><div class="lbs-loader-dots"><span></span><span></span><span></span></div></div></div><div id="app-shell"></div><div id="toast-host"></div>
<script type="module">
import{requireTeacher,mountShell,supabase,escapeHtml,toast,getCachedSchoolSettings}from'./assets/app.js';
const esc=escapeHtml,p=new URLSearchParams(location.search),studentId=p.get('studentid')||p.get('id'),classIdParam=p.get('classid')||p.get('class'),loader=document.querySelector('#page-loader');
let user,term,enrollment,subjects=[],existing=new Map(),settings=getCachedSchoolSettings();
const hide=()=>{loader?.classList.add('is-hidden');setTimeout(()=>loader?.remove(),380)};
const grade=n=>{const r=(settings.grading_rules||[]).find(x=>Number(n)>=Number(x.min)&&Number(n)<=Number(x.max));return r?.grade||'F'};
const point=n=>{const r=(settings.grading_rules||[]).find(x=>Number(n)>=Number(x.min)&&Number(n)<=Number(x.max));return r?.point??0};
function render(html){const s=document.querySelector('#app-shell');s.dataset.content=html;mountShell(user)}
function updateCard(card){const ca=Number(card.querySelector('.bulk-ca').value||0),ex=Number(card.querySelector('.bulk-exam').value||0),total=ca+ex;card.querySelector('.bulk-total strong').textContent=total.toFixed(2).replace(/\.00$/,'');card.querySelector('.bulk-grade').textContent=grade(total);card.querySelector('.bulk-point').textContent=point(total)}
function renderForm(){
 const s=enrollment.students||{},name=[s.first_name,s.middle_name,s.last_name].filter(Boolean).join(' ');
 const cards=subjects.map(sub=>{const r=existing.get(sub.id);if(r)return '<article class="bulk-card"><div class="bulk-head"><div><h3>'+esc(sub.name)+(sub.code?' · '+esc(sub.code):'')+'</h3><p>CA max '+esc(sub.max_ca??40)+' · Exam max '+esc(sub.max_exam??60)+'</p></div><span class="bulk-existing">'+esc(r.status||'RESULT EXISTS')+'</span></div><p class="bulk-note">A result already exists for this subject this term. Duplicate entry is disabled.</p></article>';return '<article class="bulk-card" data-subject-id="'+esc(sub.id)+'"><div class="bulk-head"><div><h3>'+esc(sub.name)+(sub.code?' · '+esc(sub.code):'')+'</h3><p>CA maximum '+esc(sub.max_ca??40)+' marks · Exam maximum '+esc(sub.max_exam??60)+' marks</p></div><span class="result-status status-none">Awaiting result</span></div><div class="bulk-fields"><label>Continuous Assessment<input class="bulk-ca" type="number" min="0" max="'+Number(sub.max_ca??40)+'" step="0.01" placeholder="0 – '+Number(sub.max_ca??40)+'"></label><label>Examination Score<input class="bulk-exam" type="number" min="0" max="'+Number(sub.max_exam??60)+'" step="0.01" placeholder="0 – '+Number(sub.max_exam??60)+'"></label><label>Teacher Remark<textarea class="bulk-remark" maxlength="500" placeholder="Optional performance remark"></textarea></label></div><div class="bulk-total"><span>Total: <strong>0</strong></span><span>Grade: <b class="bulk-grade">F</b> · Point: <b class="bulk-point">0</b></span></div></article>'}).join('');
 render('<div class="bulk-page"><section class="bulk-hero"><span class="hero-kicker">TEACHER RESULT ENTRY</span><h2>Add Student Results</h2><p>All active subjects assigned to you for this student’s class are listed below. Enter each subject’s CA and examination scores, then save or submit them together.</p></section><section class="bulk-student"><div class="detail-avatar">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'" alt="">':esc(((s.first_name||'')[0]||'')+((s.last_name||'')[0]||'')))+'</div><div><h3>'+esc(name||'Student')+'</h3><div class="bulk-meta"><span>Student ID: '+esc(s.student_id||'—')+'</span><span>Exam No: '+esc(s.exam_number||'—')+'</span><span>Class: '+esc(enrollment.classes?.name||'—')+'</span><span>Level: '+esc(enrollment.classes?.level||'—')+'</span><span>Term: '+esc(term.name)+'</span></div></div></section><section><div class="panel-head"><div><h3 style="margin:0">All Assigned Class Subjects</h3><p style="margin:5px 0 0;color:#667085;font-size:11px">'+subjects.length+' subject(s) · Existing results cannot be duplicated.</p></div><a class="btn secondary" href="results.html?class='+encodeURIComponent(enrollment.class_id)+'">← Back to Students</a></div><div class="bulk-subjects">'+cards+'</div></section><div class="bulk-footer"><div class="bulk-note">Fill in the scores for each subject you are ready to record. Subjects left blank will not be saved.</div><div class="bulk-actions"><button class="btn secondary" id="save-draft" type="button">Save All as Draft</button><button class="btn" id="submit-results" type="button">Submit All to Admin</button></div></div><div id="bulk-message" class="bulk-note"></div></div>');
 document.querySelectorAll('.bulk-card[data-subject-id]').forEach(card=>card.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>updateCard(card))));
 document.querySelector('#save-draft').onclick=()=>save('DRAFT');document.querySelector('#submit-results').onclick=()=>save('SUBMITTED');
}
async function save(status){
 const cards=[...document.querySelectorAll('.bulk-card[data-subject-id]')],msg=document.querySelector('#bulk-message'),buttons=[document.querySelector('#save-draft'),document.querySelector('#submit-results')];
 try{buttons.forEach(b=>b.disabled=true);const payload=[];for(const card of cards){const caText=card.querySelector('.bulk-ca').value,examText=card.querySelector('.bulk-exam').value;if(caText===''&&examText==='')continue;const sub=subjects.find(x=>x.id===card.dataset.subjectId),ca=Number(caText),exam=Number(examText);if(caText===''||!Number.isFinite(ca)||ca<0||ca>Number(sub.max_ca??40))throw new Error(sub.name+': CA must be between 0 and '+Number(sub.max_ca??40)+'.');if(examText===''||!Number.isFinite(exam)||exam<0||exam>Number(sub.max_exam??60))throw new Error(sub.name+': Exam must be between 0 and '+Number(sub.max_exam??60)+'.');const total=ca+exam;payload.push({enrollment_id:enrollment.id,term_id:term.id,subject_id:sub.id,ca_score:ca,exam_score:exam,total,grade:grade(total),grade_point:point(total),teacher_remark:card.querySelector('.bulk-remark').value.trim()||null,created_by:user.id,status})}if(!payload.length)throw new Error('Enter CA and examination scores for at least one subject.');msg.textContent='Saving '+payload.length+' subject result(s)…';const{error}=await supabase.from('results').insert(payload);if(error)throw error;toast(status==='SUBMITTED'?'Results submitted to the administrator.':'Results saved as drafts.');msg.textContent=status==='SUBMITTED'?'All entered results have been submitted to the administrator for review.':'All entered results have been saved as drafts.';setTimeout(()=>location.href='results.html?class='+encodeURIComponent(enrollment.class_id),900)}catch(e){console.error(e);msg.textContent=e.message||'Results could not be saved.';toast(msg.textContent,'error')}finally{buttons.forEach(b=>b.disabled=false)}
}
async function load(){
 if(!studentId)throw new Error('No student was selected. Return to Enter Results and choose a student.');
 const{data:t,error:te}=await supabase.from('terms').select('id,name,session_id,academic_sessions(name)').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle();if(te)throw te;if(!t)throw new Error('There is no current academic term configured.');term=t;
 const sr=await supabase.from('school_settings').select('*').limit(1).maybeSingle();if(!sr.error&&sr.data)settings=sr.data;
 const{data:e,error:ee}=await supabase.from('enrollments').select('id,student_id,class_id,status,students(id,first_name,middle_name,last_name,student_id,exam_number,photo_url),classes(id,name,level)').eq('student_id',studentId).eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();if(ee)throw ee;if(!e)throw new Error('Active student enrollment not found.');enrollment=e;if(classIdParam&&String(classIdParam)!==String(e.class_id))throw new Error('The selected class does not match this student enrollment.');
 const{data:a,error:ae}=await supabase.from('class_subjects').select('id,class_id,subject_id,teacher_id,subjects(id,name,code,max_ca,max_exam,is_active)').eq('teacher_id',user.teacher.id).eq('class_id',e.class_id).order('id');if(ae)throw ae;subjects=(a||[]).filter(x=>x.subjects?.is_active).map(x=>x.subjects);if(!subjects.length)throw new Error('No active subjects are assigned to you for this class.');
 const ids=subjects.map(x=>x.id),{data:r,error:re}=await supabase.from('results').select('id,subject_id,status').eq('enrollment_id',e.id).eq('term_id',term.id).in('subject_id',ids);if(re)throw re;existing=new Map((r||[]).map(x=>[x.subject_id,x]));renderForm();
}
try{user=await requireTeacher();if(user){const{data:t,error}=await supabase.from('teachers').select('id,full_name').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher profile could not be verified.');user.teacher={...user.teacher,...t};await load()}}catch(e){console.error(e);if(user){render('<div class="form-page"><section class="score-card"><h2>Result sheet unavailable</h2><p>'+esc(e.message||'Could not load this student.')+'</p><a class="btn" href="results.html">Back to Enter Results</a></section></div>')}toast(e.message||'Could not load the result sheet.','error')}finally{hide()}
</script></body></html>
